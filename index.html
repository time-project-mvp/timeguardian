<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Time Guardian — plataforma de inteligência e governança do tempo executivo: agenda, tarefas, consignação temporal e análise de prioridades.">
<title>Time Guardian — Executive Time Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TIME GUARDIAN — DESIGN TOKENS
   ============================================================ */
:root{
  --bg:            #15171B;
  --bg-elevated:   #1B1E23;
  --bg-elevated-2: #20242A;
  --bg-sidebar:    #101216;
  --bg-hover:      #24282F;
  --border:        #272B31;
  --border-strong: #363B42;
  --text-primary:  #EDEAE2;
  --text-secondary:#9498A0;
  --text-tertiary: #61656D;
  --accent:        #C09A5C;
  --accent-dim:    #8A7245;
  --accent-soft:   rgba(192,154,92,.13);
  --critical:      #B4553C;
  --critical-soft: rgba(180,85,60,.14);
  --high:          #C09A5C;
  --high-soft:     rgba(192,154,92,.14);
  --medium:        #6C7FA0;
  --medium-soft:   rgba(108,127,160,.14);
  --low:           #6B7078;
  --low-soft:      rgba(107,112,120,.14);
  --available:     #6E8F72;
  --available-soft:rgba(110,143,114,.14);
  --radius-sm: 3px;
  --radius-md: 5px;
  --font-display: 'Fraunces', serif;
  --font-body: 'IBM Plex Sans', sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --sidebar-w: 236px;
}

*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  background:
    radial-gradient(1100px 620px at 14% -8%, rgba(192,154,92,.05), transparent 60%),
    radial-gradient(900px 700px at 100% 0%, rgba(108,127,160,.045), transparent 55%),
    var(--bg);
  color:var(--text-primary);
  font-family:var(--font-body);
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:13px;}
a{color:inherit;}
::selection{background:var(--accent-soft); color:var(--text-primary);}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border-strong); border-radius:4px;}
:focus-visible{outline:2px solid var(--accent); outline-offset:1px;}

.eyebrow{
  font-family:var(--font-mono);
  font-size:10.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--text-tertiary);
}

/* ============================================================
   APP SHELL
   ============================================================ */
#app{display:flex; height:100vh; width:100vw;}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:var(--sidebar-w);
  flex:0 0 var(--sidebar-w);
  background:var(--bg-sidebar);
  border-right:1px solid var(--border);
  display:flex;
  flex-direction:column;
  padding:22px 0 16px;
}
.brand{
  padding:0 22px 22px;
  border-bottom:1px solid var(--border);
  margin-bottom:14px;
}
.brand-mark{
  font-family:var(--font-display);
  font-size:20px;
  font-weight:600;
  letter-spacing:.01em;
  color:var(--text-primary);
  display:flex;
  align-items:center;
  gap:9px;
}
.brand-mark .dot{width:7px; height:7px; border-radius:50%; background:var(--accent); flex:0 0 auto;}
.brand-sub{
  margin-top:4px;
  font-family:var(--font-mono);
  font-size:9.5px;
  letter-spacing:.13em;
  text-transform:uppercase;
  color:var(--text-tertiary);
}
.nav-group{padding:0 12px; margin-bottom:4px;}
.nav-label{
  font-family:var(--font-mono);
  font-size:9.5px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:var(--text-tertiary);
  padding:14px 10px 6px;
}
.nav-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 10px;
  border-radius:var(--radius-sm);
  color:var(--text-secondary);
  font-size:13px;
  cursor:pointer;
  transition:background .12s, color .12s;
  border:1px solid transparent;
  user-select:none;
}
.nav-item svg{width:15px; height:15px; opacity:.85; flex:0 0 auto;}
.nav-item:hover{background:var(--bg-hover); color:var(--text-primary);}
.nav-item.active{background:var(--accent-soft); color:var(--accent); border-color:rgba(192,154,92,.25);}
.nav-item .count{
  margin-left:auto;
  font-family:var(--font-mono);
  font-size:10.5px;
  color:var(--text-tertiary);
}
.nav-item.active .count{color:var(--accent);}
.sidebar-foot{
  margin-top:auto;
  padding:14px 22px 0;
  border-top:1px solid var(--border);
  font-family:var(--font-mono);
  font-size:10px;
  color:var(--text-tertiary);
  letter-spacing:.04em;
}

/* ---------- MAIN ---------- */
.main{flex:1; display:flex; flex-direction:column; min-width:0;}
.topbar{
  height:64px;
  flex:0 0 64px;
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 26px;
  gap:18px;
  background:var(--bg);
}
.topbar .date-block{display:flex; flex-direction:column; line-height:1.15; min-width:150px;}
.topbar .date-main{font-family:var(--font-display); font-size:16.5px; font-weight:600;}
.date-sub-row{display:flex; align-items:baseline; gap:8px; margin-top:2px;}
.topbar .date-sub{font-family:var(--font-mono); font-size:10px; color:var(--text-tertiary); letter-spacing:.06em; text-transform:uppercase;}
.top-clock{font-family:var(--font-mono); font-size:10px; color:var(--accent); letter-spacing:.05em;}
#menuToggle{display:none;}
.sidebar-backdrop{display:none;}
.period-nav{display:flex; align-items:center; gap:4px;}
.icon-btn{
  width:30px; height:30px;
  display:flex; align-items:center; justify-content:center;
  border-radius:var(--radius-sm);
  border:1px solid var(--border);
  background:var(--bg-elevated);
  color:var(--text-secondary);
  transition:.12s;
}
.icon-btn:hover{color:var(--text-primary); border-color:var(--border-strong); background:var(--bg-hover);}
.icon-btn svg{width:14px; height:14px;}
.today-btn{
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase;
  padding:0 10px; height:30px; border-radius:var(--radius-sm);
  border:1px solid var(--border); background:var(--bg-elevated); color:var(--text-secondary);
}
.today-btn:hover{color:var(--text-primary); border-color:var(--border-strong);}
.view-tabs{display:flex; gap:2px; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-sm); padding:2px;}
.view-tab{
  padding:5px 12px; font-size:12px; color:var(--text-secondary); border-radius:2px; letter-spacing:.02em;
}
.view-tab.active{background:var(--bg-hover); color:var(--text-primary);}
.search-wrap{
  flex:1; max-width:320px; position:relative;
}
.search-wrap input{
  width:100%; background:var(--bg-elevated); border:1px solid var(--border); color:var(--text-primary);
  border-radius:var(--radius-sm); padding:7px 10px 7px 30px; font-size:12.5px;
}
.search-wrap input::placeholder{color:var(--text-tertiary);}
.search-wrap input:focus{border-color:var(--border-strong);}
.search-wrap svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); width:13px; height:13px; color:var(--text-tertiary);}
.topbar-right{margin-left:auto; display:flex; align-items:center; gap:12px;}
.avail-pill{
  display:flex; align-items:center; gap:7px;
  padding:6px 11px; border-radius:20px;
  border:1px solid var(--available);
  background:var(--available-soft);
  font-family:var(--font-mono); font-size:10.5px; letter-spacing:.04em; color:var(--available);
}
.avail-pill .pulse{width:6px; height:6px; border-radius:50%; background:var(--available); box-shadow:0 0 0 0 rgba(110,143,114,.6); animation:pulse 2.4s infinite;}
@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(110,143,114,.5);}
  70%{box-shadow:0 0 0 6px rgba(110,143,114,0);}
  100%{box-shadow:0 0 0 0 rgba(110,143,114,0);}
}
.btn{
  display:inline-flex; align-items:center; gap:7px;
  padding:8px 14px; border-radius:var(--radius-sm);
  font-size:12.5px; font-weight:500; letter-spacing:.01em;
  border:1px solid var(--border-strong);
  background:var(--bg-elevated); color:var(--text-primary);
  transition:.12s;
}
.btn:hover{background:var(--bg-hover);}
.btn svg{width:13px; height:13px;}
.btn-primary{background:var(--accent); border-color:var(--accent); color:#171310; font-weight:600;}
.btn-primary:hover{background:#cba566;}
.btn-ghost{background:transparent; border-color:var(--border);}
.btn-danger{border-color:var(--critical); color:var(--critical); background:transparent;}
.btn-danger:hover{background:var(--critical-soft);}
.btn-sm{padding:5px 10px; font-size:11.5px;}
.profile-chip{
  width:32px; height:32px; border-radius:50%;
  background:var(--bg-elevated-2); border:1px solid var(--border-strong);
  display:flex; align-items:center; justify-content:center;
  font-family:var(--font-display); font-size:13px; color:var(--accent); font-weight:600;
}

/* ---------- VIEW CONTAINER ---------- */
.view-container{flex:1; overflow-y:auto; padding:26px 30px 60px;}
.view-header{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px;}
.view-title{font-family:var(--font-display); font-size:22px; font-weight:600;}
.view-title-sub{font-size:12px; color:var(--text-tertiary); margin-top:3px;}

/* ============================================================
   WORLD CLOCK — painel fixo de fusos horários (tela inicial)
   ============================================================ */
.worldclock-panel{
  display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:16px;
}
.wc-card{
  background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-md);
  padding:16px 18px; position:relative; overflow:hidden;
}
.wc-card::before{
  content:''; position:absolute; top:0; left:0; right:0; height:2px; background:var(--border-strong);
}
.wc-card.standard::before{background:var(--medium);}
.wc-card.ny::before{background:var(--high);}
.wc-card.personal::before{background:var(--accent);}
.wc-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.wc-label{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-tertiary);}
.wc-flag{font-size:10px; color:var(--text-tertiary);}
.wc-time{font-family:var(--font-mono); font-size:26px; font-weight:600; letter-spacing:.02em; color:var(--text-primary); line-height:1;}
.wc-time .secs{font-size:14px; color:var(--text-tertiary); font-weight:400;}
.wc-date{margin-top:6px; font-size:11px; color:var(--text-secondary);}
.wc-pin{position:absolute; top:12px; right:14px; width:5px; height:5px; border-radius:50%; background:var(--available); box-shadow:0 0 0 0 rgba(110,143,114,.6); animation:pulse 2.4s infinite;}

/* ============================================================
   TRAJETO — rota / veículo executivo
   ============================================================ */
.route-toggle{
  display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--accent);
  background:var(--accent-soft); border:1px solid rgba(192,154,92,.3); border-radius:20px;
  padding:6px 12px; margin-top:8px; width:fit-content;
}
.route-toggle svg{width:12px; height:12px;}
.route-panel{
  margin-top:10px; border:1px solid var(--border); border-radius:var(--radius-sm);
  background:var(--bg-elevated-2); padding:14px 16px;
}
.route-line{display:flex; align-items:center; gap:10px; margin-bottom:12px;}
.route-point{flex:1; min-width:0;}
.route-point .rp-lbl{font-family:var(--font-mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-tertiary);}
.route-point .rp-name{font-size:12.5px; font-weight:600; margin-top:2px;}
.route-point .rp-sub{font-size:10.5px; color:var(--text-tertiary); margin-top:1px;}
.route-arrow{flex:0 0 auto; display:flex; flex-direction:column; align-items:center; color:var(--accent); min-width:64px;}
.route-arrow svg{width:22px; height:22px;}
.route-arrow .veh{font-family:var(--font-mono); font-size:9px; letter-spacing:.04em; color:var(--text-tertiary); margin-top:3px; text-align:center;}
.route-meta{display:flex; gap:18px; flex-wrap:wrap; border-top:1px solid var(--border); padding-top:10px;}
.route-badge{display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:20px; font-size:10.5px; font-family:var(--font-mono); background:var(--accent-soft); color:var(--accent); border:1px solid rgba(192,154,92,.3);}
.route-fleet-note{margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); font-size:10.5px; color:var(--text-tertiary);}
.veh-code{font-family:var(--font-mono); color:var(--accent); letter-spacing:.03em;}
.sub-route{font-size:10.5px; color:var(--text-tertiary); margin-top:2px; display:flex; align-items:center; gap:5px;}
.sub-route svg{width:10px; height:10px; flex:0 0 auto;}
.loc-detail-box{
  margin-top:8px; border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px;
  background:var(--bg-elevated-2); font-size:11.5px; color:var(--text-secondary); display:flex; gap:16px; flex-wrap:wrap;
}
.loc-detail-box .ldk{font-family:var(--font-mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-tertiary); display:block; margin-bottom:2px;}

/* ============================================================
   OVERVIEW
   ============================================================ */
.ov-grid{display:grid; grid-template-columns:1.3fr 1fr; gap:16px; margin-bottom:16px;}
.panel{
  background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-md);
  padding:20px; box-shadow:inset 0 1px 0 rgba(255,255,255,.02);
}
.panel-label{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
.now-block .now-time{font-family:var(--font-mono); font-size:11px; color:var(--accent); letter-spacing:.06em;}
.now-title{font-family:var(--font-display); font-size:20px; font-weight:600; margin:8px 0 10px;}
.meta-row{display:flex; gap:18px; flex-wrap:wrap; margin-top:10px;}
.meta-item{display:flex; flex-direction:column; gap:2px;}
.meta-item .k{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-tertiary);}
.meta-item .v{font-size:13px; color:var(--text-secondary);}
.priority-tag{
  display:inline-flex; align-items:center; gap:5px;
  padding:3px 9px; border-radius:20px; font-size:10.5px; font-family:var(--font-mono); letter-spacing:.05em; text-transform:uppercase;
}
.priority-tag.critical{background:var(--critical-soft); color:var(--critical);}
.priority-tag.alta{background:var(--high-soft); color:var(--high);}
.priority-tag.media{background:var(--medium-soft); color:var(--medium);}
.priority-tag.baixa{background:var(--low-soft); color:var(--low);}
.priority-tag::before{content:''; width:5px; height:5px; border-radius:50%; background:currentColor;}

.empty-now{color:var(--text-tertiary); font-size:13px; padding:18px 0;}

.indicators{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px;}
.indicator{
  background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-md);
  padding:16px 18px; box-shadow:inset 0 1px 0 rgba(255,255,255,.02); transition:border-color .15s;
}
.indicator:hover{border-color:var(--border-strong);}
.indicator .num{font-family:var(--font-display); font-size:28px; font-weight:600; line-height:1;}
.indicator .lbl{margin-top:8px; font-family:var(--font-mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-tertiary);}
.indicator.accent .num{color:var(--accent);}
.indicator.crit .num{color:var(--critical);}

.alerts-panel{margin-bottom:16px;}
.alert-row{
  display:flex; gap:11px; align-items:flex-start;
  padding:11px 0; border-top:1px solid var(--border);
}
.alert-row:first-of-type{border-top:none; padding-top:2px;}
.alert-dot{width:6px; height:6px; border-radius:50%; margin-top:5px; flex:0 0 auto;}
.alert-dot.warn{background:var(--high);}
.alert-dot.crit{background:var(--critical);}
.alert-dot.info{background:var(--medium);}
.alert-text{font-size:12.5px; color:var(--text-secondary); line-height:1.5;}
.alert-text b{color:var(--text-primary); font-weight:600;}

.next-list .agenda-mini-row{
  display:flex; align-items:center; gap:12px; padding:10px 0; border-top:1px solid var(--border);
}
.next-list .agenda-mini-row:first-of-type{border-top:none;}
.mini-time{font-family:var(--font-mono); font-size:11.5px; color:var(--text-tertiary); width:44px; flex:0 0 auto;}
.mini-bar{width:2.5px; height:26px; border-radius:2px; flex:0 0 auto;}
.mini-title{font-size:12.5px; color:var(--text-primary); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.mini-loc{font-size:11px; color:var(--text-tertiary);}

/* ============================================================
   TIME GUARDIAN INTELLIGENCE — dashboard layer, time intelligence,
   consignação temporal e malha itinerária
   ============================================================ */
.tgi-panel{
  background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-md);
  padding:20px; margin-bottom:16px; box-shadow:inset 0 1px 0 rgba(255,255,255,.02);
}
.tgi-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:16px; gap:12px; flex-wrap:wrap;}
.tgi-head .eyebrow{color:var(--accent);}
.tgi-head-sub{font-size:11.5px; color:var(--text-tertiary);}
.tgi-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:12px;}
.tgi-card{
  border:1px solid var(--border); border-radius:var(--radius-md); padding:14px 14px 12px;
  background:var(--bg-elevated-2); display:flex; flex-direction:column; gap:6px;
}
.tgi-card.risk{border-color:rgba(180,85,60,.35);}
.tgi-card.ok{border-color:rgba(110,143,114,.3);}
.tgi-card .tgi-num{font-family:var(--font-display); font-size:24px; font-weight:600; line-height:1;}
.tgi-card.risk .tgi-num{color:var(--critical);}
.tgi-card.ok .tgi-num{color:var(--available);}
.tgi-card .tgi-lbl{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--text-tertiary);}
.tgi-card .tgi-note{font-size:11px; color:var(--text-secondary); line-height:1.4;}

.bar-row{display:grid; grid-template-columns:112px 1fr 46px; align-items:center; gap:10px; padding:6px 0;}
.bar-label{font-size:11.5px; color:var(--text-secondary); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bar-track{height:7px; border-radius:20px; background:var(--bg-elevated-2); border:1px solid var(--border); overflow:hidden;}
.bar-fill{height:100%; border-radius:20px;}
.bar-val{font-family:var(--font-mono); font-size:10.5px; color:var(--text-tertiary); text-align:right;}

.priority-vs{
  display:flex; align-items:center; justify-content:center; gap:14px; text-align:center;
  padding:18px 10px; margin-top:4px;
}
.priority-vs .pv-word{font-family:var(--font-display); font-size:17px; font-weight:600;}
.priority-vs .pv-neq{font-family:var(--font-mono); font-size:15px; color:var(--accent);}

.consign-list{display:flex; flex-direction:column; gap:14px;}
.consign-card{
  border:1px solid var(--border); border-radius:var(--radius-md); padding:16px 18px; background:var(--bg-elevated-2);
}
.consign-top{display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px;}
.consign-title{font-family:var(--font-display); font-size:16px; font-weight:600;}
.consign-type{font-family:var(--font-mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-tertiary); margin-top:3px;}
.status-badge{
  display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:20px;
  font-size:10px; font-family:var(--font-mono); letter-spacing:.05em; text-transform:uppercase; white-space:nowrap;
}
.status-badge::before{content:''; width:5px; height:5px; border-radius:50%; background:currentColor;}
.status-badge.risco{background:var(--critical-soft); color:var(--critical);}
.status-badge.atencao{background:var(--high-soft); color:var(--high);}
.status-badge.no-prazo{background:var(--available-soft); color:var(--available);}
.status-badge.concluido{background:var(--medium-soft); color:var(--medium);}
.consign-track{height:10px; border-radius:20px; background:var(--bg); border:1px solid var(--border); overflow:hidden; position:relative; margin:10px 0 12px;}
.consign-seg{height:100%; position:absolute; top:0; left:0;}
.consign-seg.used{background:var(--accent); z-index:2;}
.consign-seg.consigned{background:var(--accent-soft); border-right:1px dashed var(--accent-dim); z-index:1;}
.consign-meta{display:flex; gap:20px; flex-wrap:wrap;}
.consign-actions{display:flex; gap:8px; margin-top:12px;}

.itn-route{display:flex; align-items:center; gap:0; margin:14px 0 10px; flex-wrap:wrap;}
.itn-stop{text-align:center; min-width:78px;}
.itn-stop .city{font-size:12.5px; font-weight:600; color:var(--text-primary);}
.itn-stop .tag{font-family:var(--font-mono); font-size:9px; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:.06em; margin-top:2px;}
.itn-link{flex:1; min-width:24px; height:1px; background:var(--border-strong); position:relative; margin:0 6px;}
.itn-link.opportunity{background:none; border-top:1px dashed var(--accent);}
.itn-opportunity-card{
  border:1px dashed var(--accent-dim); border-radius:var(--radius-md); padding:14px 16px; margin-top:10px;
  background:var(--accent-soft);
}
.itn-opportunity-card .io-title{font-family:var(--font-display); font-size:15px; font-weight:600; margin-bottom:8px;}
.itn-analysis{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:10px 0;}
.itn-analysis .ia-k{font-family:var(--font-mono); font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-tertiary);}
.itn-analysis .ia-v{font-size:12.5px; color:var(--text-primary); margin-top:2px;}
.itn-alts{display:flex; gap:8px; flex-wrap:wrap; margin-top:6px;}
.itn-alt-chip{font-size:10.5px; padding:4px 10px; border-radius:20px; border:1px solid var(--border-strong); color:var(--text-secondary);}

.thinking-slots{display:flex; gap:8px; margin-top:10px; flex-wrap:wrap;}
.thinking-slot{font-family:var(--font-mono); font-size:10.5px; padding:5px 11px; border-radius:20px; background:var(--accent-soft); color:var(--accent); border:1px solid rgba(192,154,92,.3);}

.thesis-block p{font-size:12.5px; color:var(--text-secondary); line-height:1.6; margin-bottom:14px;}
.thesis-cols{display:grid; grid-template-columns:1fr 1fr; gap:18px;}
.thesis-col-title{font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin-bottom:8px;}
.thesis-cols ul{padding-left:18px; margin:0;}
.thesis-cols li{font-size:12.5px; color:var(--text-secondary); margin-bottom:4px;}

@media (max-width:1100px){
  .tgi-grid{grid-template-columns:repeat(3,1fr);}
  .itn-analysis{grid-template-columns:1fr 1fr;}
}
@media (max-width:720px){
  .tgi-grid{grid-template-columns:repeat(2,1fr);}
  .thesis-cols{grid-template-columns:1fr;}
  .bar-row{grid-template-columns:84px 1fr 40px;}
}

/* ============================================================
   AGENDA — DAY TIMELINE (signature element)
   ============================================================ */
.timeline-wrap{position:relative; display:flex; background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden;}
.timeline-rail{
  width:64px; flex:0 0 64px; border-right:1px solid var(--border); position:relative;
  background:var(--bg-elevated-2);
}
.timeline-hour{
  height:72px; position:relative; font-family:var(--font-mono); font-size:10px; color:var(--text-tertiary);
  border-top:1px solid var(--border);
}
.timeline-hour span{position:absolute; top:-6px; right:9px; background:var(--bg-elevated-2); padding:0 2px;}
.timeline-hour:first-child{border-top:none;}
.timeline-body{flex:1; position:relative;}
.timeline-grid-line{position:absolute; left:0; right:0; height:72px; border-top:1px solid var(--border);}
.timeline-grid-line.half::after{content:''; position:absolute; left:0; right:0; top:36px; border-top:1px dashed var(--border);}
.now-line{
  position:absolute; left:0; right:0; height:0; border-top:2px solid var(--accent); z-index:5;
}
.now-line::before{
  content:'AGORA'; position:absolute; left:8px; top:-9px; background:var(--accent); color:#171310;
  font-family:var(--font-mono); font-size:9px; letter-spacing:.08em; padding:1px 6px; border-radius:2px; font-weight:600;
}
.appt-block{
  position:absolute; left:14px; right:14px; border-radius:var(--radius-sm);
  background:var(--bg-hover); border:1px solid var(--border-strong); border-left:3px solid var(--medium);
  padding:8px 12px; overflow:hidden; cursor:pointer; transition:.12s;
}
.appt-block:hover{background:var(--bg-elevated-2); border-color:var(--accent);}
.appt-block.p-critical{border-left-color:var(--critical);}
.appt-block.p-alta{border-left-color:var(--high);}
.appt-block.p-media{border-left-color:var(--medium);}
.appt-block.p-baixa{border-left-color:var(--low);}
.appt-block .t{font-family:var(--font-mono); font-size:10px; color:var(--text-tertiary); letter-spacing:.03em;}
.appt-block .ttl{font-size:12.5px; font-weight:600; margin-top:2px; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.appt-block .sub{font-size:11px; color:var(--text-secondary); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.appt-block.conflict{outline:1px solid var(--critical);}
.appt-block.conflict::after{
  content:'CONFLITO'; position:absolute; top:6px; right:8px; font-family:var(--font-mono); font-size:8.5px;
  color:var(--critical); letter-spacing:.06em;
}
.appt-block.compact .ttl{font-size:11.5px;}
.appt-block.compact .sub{display:none;}

/* Week view */
.week-grid{display:grid; grid-template-columns:56px repeat(7,1fr); background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-md); overflow:hidden;}
.week-head{padding:10px 6px; text-align:center; border-bottom:1px solid var(--border); border-left:1px solid var(--border);}
.week-head:first-child{border-left:none;}
.week-head .d{font-family:var(--font-mono); font-size:9.5px; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:.06em;}
.week-head .n{font-family:var(--font-display); font-size:16px; margin-top:3px;}
.week-head.today .n{color:var(--accent);}
.week-col{border-left:1px solid var(--border); min-height:520px; padding:8px 6px; position:relative;}
.week-col:first-child{border-left:none;}
.week-corner{border-bottom:1px solid var(--border);}
.week-chip{
  background:var(--bg-hover); border-left:2.5px solid var(--medium); border-radius:2px;
  padding:5px 7px; margin-bottom:5px; font-size:10.5px; cursor:pointer;
}
.week-chip:hover{background:var(--bg-elevated-2);}
.week-chip .wt{font-family:var(--font-mono); font-size:9px; color:var(--text-tertiary);}
.week-chip .wtl{font-weight:600; color:var(--text-primary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.week-chip.p-critical{border-left-color:var(--critical);}
.week-chip.p-alta{border-left-color:var(--high);}
.week-chip.p-media{border-left-color:var(--medium);}
.week-chip.p-baixa{border-left-color:var(--low);}

/* List view */
.list-row{
  display:flex; align-items:center; gap:14px; padding:13px 16px;
  border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg-elevated);
  margin-bottom:8px; cursor:pointer; transition:.12s;
}
.list-row:hover{border-color:var(--border-strong); background:var(--bg-hover);}
.list-row .lr-time{font-family:var(--font-mono); font-size:11.5px; color:var(--text-tertiary); width:100px; flex:0 0 auto;}
.list-row .lr-bar{width:3px; height:30px; border-radius:2px; flex:0 0 auto;}
.list-row .lr-main{flex:1; min-width:0;}
.list-row .lr-title{font-size:13px; font-weight:600;}
.list-row .lr-sub{font-size:11.5px; color:var(--text-tertiary); margin-top:2px;}
.list-row .lr-cat{font-family:var(--font-mono); font-size:10px; color:var(--text-tertiary);}

/* ============================================================
   GENERIC CARD LISTS (Queue, Tasks, People, Locations)
   ============================================================ */
.queue-item{
  display:flex; align-items:center; gap:14px; padding:14px 16px;
  border:1px solid var(--border); border-radius:var(--radius-sm); background:var(--bg-elevated); margin-bottom:8px;
}
.queue-item .qi-order{font-family:var(--font-mono); font-size:11px; color:var(--text-tertiary); width:20px;}
.queue-item .qi-main{flex:1; min-width:0;}
.queue-item .qi-title{font-size:13px; font-weight:600;}
.queue-item .qi-meta{display:flex; gap:12px; margin-top:4px; flex-wrap:wrap;}
.queue-item .qi-meta span{font-size:11px; color:var(--text-tertiary); font-family:var(--font-mono);}
.qi-actions{display:flex; gap:4px;}

.kanban{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
.kanban-col{background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px; min-height:200px;}
.kanban-col h4{font-family:var(--font-mono); font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--text-tertiary); margin-bottom:12px; display:flex; justify-content:space-between;}
.kanban-card{
  background:var(--bg-hover); border:1px solid var(--border); border-left:3px solid var(--medium); border-radius:var(--radius-sm);
  padding:10px 11px; margin-bottom:8px; cursor:grab;
}
.kanban-card.p-critical{border-left-color:var(--critical);}
.kanban-card.p-alta{border-left-color:var(--high);}
.kanban-card.p-media{border-left-color:var(--medium);}
.kanban-card.p-baixa{border-left-color:var(--low);}
.kanban-card .kt{font-size:12.5px; font-weight:600;}
.kanban-card .km{font-size:10.5px; color:var(--text-tertiary); margin-top:5px; font-family:var(--font-mono);}
.kanban-col.dragover{border-color:var(--accent);}

.data-table{width:100%; border-collapse:collapse;}
.data-table th{
  text-align:left; font-family:var(--font-mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--text-tertiary); padding:10px 12px; border-bottom:1px solid var(--border-strong);
}
.data-table td{padding:11px 12px; border-bottom:1px solid var(--border); font-size:12.5px;}
.data-table tr:hover td{background:var(--bg-hover);}
.data-table tr{cursor:pointer;}
.table-wrap{background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-md); overflow-x:auto;}
.table-wrap table{min-width:640px;}

/* Frota */
.fleet-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:14px;}
.fleet-card{padding:18px;}
.fleet-top{display:flex; align-items:center; gap:12px;}
.fleet-icon{width:38px; height:38px; border-radius:var(--radius-sm); background:var(--accent-soft); color:var(--accent); display:flex; align-items:center; justify-content:center; flex:0 0 auto;}
.fleet-icon svg{width:19px; height:19px;}
.fleet-model{font-family:var(--font-display); font-size:15px; font-weight:600;}
.fleet-code{font-family:var(--font-mono); font-size:10.5px; color:var(--accent); letter-spacing:.04em; margin-top:1px;}
.fleet-type-tag{margin-left:auto; font-family:var(--font-mono); font-size:9.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-tertiary); border:1px solid var(--border); border-radius:20px; padding:3px 9px;}
.fleet-note{margin-top:12px; padding-top:10px; border-top:1px solid var(--border); font-size:11.5px; color:var(--text-tertiary); line-height:1.5;}
.row-actions{display:flex; gap:6px; opacity:.75;}

/* Categories tree */
.cat-tree{background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius-md); padding:8px;}
.cat-node{}
.cat-row{
  display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:var(--radius-sm);
}
.cat-row:hover{background:var(--bg-hover);}
.cat-row .cat-color{width:8px; height:8px; border-radius:2px; flex:0 0 auto;}
.cat-row .cat-name{font-size:13px; flex:1;}
.cat-row .cat-count{font-family:var(--font-mono); font-size:10px; color:var(--text-tertiary);}
.cat-children{margin-left:26px; border-left:1px dashed var(--border); padding-left:10px;}
.cat-actions{display:flex; gap:4px; opacity:0; transition:.12s;}
.cat-row:hover .cat-actions{opacity:1;}

/* Priority engine view */
.priority-formula{
  font-family:var(--font-mono); font-size:12px; color:var(--text-secondary); background:var(--bg-elevated-2);
  border:1px solid var(--border); border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:18px; line-height:1.8;
}
.priority-formula .op{color:var(--accent);}
.priority-buckets{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px;}
.priority-bucket{border-radius:var(--radius-md); padding:16px; border:1px solid var(--border);}
.priority-bucket.critical{background:var(--critical-soft); border-color:rgba(180,85,60,.35);}
.priority-bucket.alta{background:var(--high-soft); border-color:rgba(192,154,92,.35);}
.priority-bucket.media{background:var(--medium-soft); border-color:rgba(108,127,160,.35);}
.priority-bucket.baixa{background:var(--low-soft); border-color:rgba(107,112,120,.35);}
.priority-bucket .pb-n{font-family:var(--font-display); font-size:24px; font-weight:600;}
.priority-bucket .pb-l{font-family:var(--font-mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; margin-top:4px;}

/* Availability grid */
.avail-table{width:100%; border-collapse:collapse;}
.avail-table th{font-family:var(--font-mono); font-size:9.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--text-tertiary); text-align:left; padding:8px 10px;}
.avail-table td{padding:8px 10px; border-top:1px solid var(--border);}
.avail-table input[type=time]{background:var(--bg-elevated-2); border:1px solid var(--border); color:var(--text-primary); border-radius:3px; padding:5px 7px;}
.avail-table input[type=checkbox]{accent-color:var(--accent);}

/* Empty state */
.empty-state{
  text-align:center; padding:60px 20px; color:var(--text-tertiary);
}
.empty-state svg{width:34px; height:34px; margin-bottom:14px; opacity:.5;}
.empty-state .es-title{font-family:var(--font-display); font-size:16px; color:var(--text-secondary); margin-bottom:6px;}
.empty-state .es-sub{font-size:12px; max-width:340px; margin:0 auto;}

/* ============================================================
   MODAL
   ============================================================ */
.modal-overlay{
  position:fixed; inset:0; background:rgba(10,11,13,.68); backdrop-filter:blur(2px);
  display:flex; align-items:flex-start; justify-content:center; z-index:100; padding:5vh 20px;
  opacity:0; pointer-events:none; transition:opacity .15s;
}
.modal-overlay.open{opacity:1; pointer-events:all;}
.modal{
  background:var(--bg-elevated); border:1px solid var(--border-strong); border-radius:var(--radius-md);
  width:100%; max-width:620px; max-height:90vh; display:flex; flex-direction:column;
  transform:translateY(8px); transition:transform .15s;
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}
.modal-overlay.open .modal{transform:translateY(0);}
.modal-head{display:flex; align-items:center; justify-content:space-between; padding:18px 22px; border-bottom:1px solid var(--border);}
.modal-head h3{font-family:var(--font-display); font-size:17px; font-weight:600;}
.modal-body{padding:20px 22px; overflow-y:auto;}
.modal-foot{display:flex; justify-content:space-between; align-items:center; padding:16px 22px; border-top:1px solid var(--border);}
.modal-foot .right{display:flex; gap:8px;}
.form-section{margin-bottom:20px;}
.form-section:last-child{margin-bottom:0;}
.form-section-title{
  font-family:var(--font-mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent);
  margin-bottom:10px; padding-bottom:6px; border-bottom:1px solid var(--border);
}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.form-grid.c3{grid-template-columns:1fr 1fr 1fr;}
.field{display:flex; flex-direction:column; gap:5px; margin-bottom:12px;}
.field.full{grid-column:1/-1;}
.field label{font-size:11px; color:var(--text-tertiary); letter-spacing:.02em;}
.field input, .field select, .field textarea{
  background:var(--bg-elevated-2); border:1px solid var(--border); color:var(--text-primary);
  border-radius:var(--radius-sm); padding:8px 10px; font-size:12.5px; width:100%;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--accent);}
.field textarea{resize:vertical; min-height:56px;}
.checkbox-row{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-secondary);}
.checkbox-row input{accent-color:var(--accent);}
.pill-select{display:flex; gap:6px; flex-wrap:wrap;}
.pill-opt{
  padding:6px 12px; border-radius:20px; font-size:11.5px; border:1px solid var(--border); color:var(--text-secondary);
  background:var(--bg-elevated-2);
}
.pill-opt.sel{border-color:var(--accent); color:var(--accent); background:var(--accent-soft);}
.tz-row{display:flex; justify-content:space-between; padding:7px 0; border-top:1px solid var(--border); font-size:12px;}
.tz-row:first-of-type{border-top:none;}
.tz-row .city{color:var(--text-secondary);}
.tz-row .time{font-family:var(--font-mono); color:var(--text-primary);}

.conflict-banner{
  display:flex; align-items:center; gap:10px; background:var(--critical-soft); border:1px solid rgba(180,85,60,.4);
  color:var(--critical); border-radius:var(--radius-sm); padding:10px 12px; font-size:12px; margin-bottom:16px;
}
.conflict-actions{display:flex; gap:6px; margin-top:10px; flex-wrap:wrap;}

/* Toasts */
#toastRoot{position:fixed; bottom:22px; right:22px; z-index:200; display:flex; flex-direction:column; gap:8px;}
.toast{
  background:var(--bg-elevated-2); border:1px solid var(--border-strong); border-left:3px solid var(--accent);
  border-radius:var(--radius-sm); padding:11px 16px; font-size:12.5px; min-width:240px;
  box-shadow:0 8px 24px rgba(0,0,0,.35); animation:toastIn .18s ease-out;
}
.toast.danger{border-left-color:var(--critical);}
@keyframes toastIn{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);}}

.confirm-box{max-width:380px;}

/* Utility */
.hidden{display:none !important;}
.text-tertiary{color:var(--text-tertiary);}
.small{font-size:11px;}
.mt8{margin-top:8px;}
.mb0{margin-bottom:0;}

/* Responsive */
@media (max-width:1080px){
  .ov-grid{grid-template-columns:1fr;}
  .indicators{grid-template-columns:repeat(2,1fr);}
  .kanban{grid-template-columns:1fr;}
  .worldclock-panel{grid-template-columns:repeat(3,1fr); gap:10px;}
}
@media (max-width:820px){
  .sidebar{position:fixed; z-index:60; height:100vh; transform:translateX(-100%); transition:transform .2s ease;}
  .sidebar.open{transform:translateX(0); box-shadow:12px 0 32px rgba(0,0,0,.4);}
  #menuToggle{display:flex;}
  .sidebar-backdrop.open{display:block; position:fixed; inset:0; background:rgba(8,9,11,.55); z-index:55;}
  .topbar{padding:0 14px; gap:10px;}
  .topbar .date-block{min-width:0;}
  .date-sub{display:none;}
  .view-tabs{display:none !important;}
  .period-nav .today-btn{display:none;}
  .search-wrap{display:none;}
  .avail-pill{display:none;}
  .btn span, .btn{white-space:nowrap;}
  #newApptBtn .btn-label{display:none;}
  .view-container{padding:16px 14px 60px;}
  .week-grid{grid-template-columns:44px repeat(7,minmax(90px,1fr)); overflow-x:auto;}
  .worldclock-panel{grid-template-columns:1fr; gap:8px;}
  .indicators{grid-template-columns:repeat(2,1fr); gap:8px;}
  .modal-overlay{padding:0; align-items:stretch;}
  .modal{max-width:100%; height:100%; max-height:100%; border-radius:0; border:none;}
  .form-grid, .form-grid.c3{grid-template-columns:1fr;}
  .fleet-grid{grid-template-columns:1fr;}
  .priority-buckets{grid-template-columns:repeat(2,1fr);}
}
@media (max-width:480px){
  .indicators{grid-template-columns:1fr 1fr;}
  .topbar{gap:8px;}
  .date-main{font-size:14px;}
  .top-clock{display:none;}
}
</style>
</head>
<body>

<div id="app">
  <!-- ============ SIDEBAR ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark"><span class="dot"></span>Time Guardian</div>
      <div class="brand-sub">Executive Time Intelligence</div>
    </div>
    <div class="nav-group">
      <div class="nav-item" data-view="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg>
        Visão Geral
      </div>
      <div class="nav-item" data-view="agenda">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="18" height="17" rx="1.5"/><path d="M3 9h18M8 3v3M16 3v3"/></svg>
        Minha Agenda

/* ============================================================
   UTILS
   ============================================================ */
const Utils = {
  uid(prefix){ return (prefix||'id') + '_' + Math.random().toString(36).slice(2,9); },
  pad(n){ return String(n).padStart(2,'0'); },
  dateKey(d){ return d.getFullYear()+'-'+Utils.pad(d.getMonth()+1)+'-'+Utils.pad(d.getDate()); },
  parseDateKey(k){ const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); },
  addDays(d, n){ const nd = new Date(d); nd.setDate(nd.getDate()+n); return nd; },
  startOfWeek(d){ const nd = new Date(d); const day = nd.getDay(); const diff = day===0?-6:1-day; nd.setDate(nd.getDate()+diff); nd.setHours(0,0,0,0); return nd; },
  timeToMin(t){ if(!t) return 0; const [h,m]=t.split(':').map(Number); return h*60+m; },
  minToTime(m){ m = ((m%1440)+1440)%1440; return Utils.pad(Math.floor(m/60))+':'+Utils.pad(m%60); },
  fmtDuration(min){ if(min<60) return min+'min'; const h=Math.floor(min/60), m=min%60; return h+'h'+(m?Utils.pad(m):'')+(m?'':''); },
  fmtDateFull(d){
    const dias = ['Domingo','Segunda-feira','Terça-feira','Quarta-feira','Quinta-feira','Sexta-feira','Sábado'];
    const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
    return dias[d.getDay()] + ', ' + d.getDate() + ' de ' + meses[d.getMonth()] + ' de ' + d.getFullYear();
  },
  fmtDateShort(d){
    const meses = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
    return Utils.pad(d.getDate())+' '+meses[d.getMonth()];
  },
  overlaps(aStart,aEnd,bStart,bEnd){ return aStart < bEnd && bStart < aEnd; },
  escape(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); },
  debounce(fn, ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a), ms); }; }
};

/* ============================================================
   STORAGE
   ============================================================ */
const STORAGE_KEY = 'timeGuardian.v1';
const LEGACY_STORAGE_KEY = 'executiveFlow.v3'; // migração transparente de instalações anteriores do Executive Flow
const Storage = {
  load(){
    try{
      let raw = localStorage.getItem(STORAGE_KEY);
      if(!raw){
        // migração transparente: se existir uma base do Executive Flow, ela vira a base do Time Guardian
        const legacy = localStorage.getItem(LEGACY_STORAGE_KEY);
        if(legacy){ raw = legacy; localStorage.setItem(STORAGE_KEY, legacy); }
      }
      if(!raw) return null;
      return JSON.parse(raw);
    }catch(e){ console.warn('Time Guardian Storage load error', e); return null; }
  },
  save(state){
    try{
      const snapshot = {
        appointments: state.appointments,
        tasks: state.tasks,
        categories: state.categories,
        people: state.people,
        locations: state.locations,
        fleet: state.fleet,
        availability: state.availability,
        settings: state.settings,
        initiatives: state.initiatives,
        _savedAt: new Date().toISOString()
      };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
    }catch(e){ console.warn('Time Guardian Storage save error', e); }
  },
  clear(){ localStorage.removeItem(STORAGE_KEY); },
  exportJSON(state){
    const data = {
      appointments: state.appointments, tasks: state.tasks, categories: state.categories,
      people: state.people, locations: state.locations, fleet: state.fleet, availability: state.availability,
      settings: state.settings, initiatives: state.initiatives, exportedAt: new Date().toISOString(), product: 'Time Guardian'
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'time-guardian-dados-' + Utils.dateKey(new Date()) + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }
};

/* ============================================================
   ENGINES
   ============================================================ */
const ConflictEngine = {
  // returns array of {a, b} overlapping pairs for a given date
  getConflicts(dateKey){
    const list = State.apptsOnDate(dateKey);
    const conflicts = [];
    for(let i=0;i<list.length;i++){
      for(let j=i+1;j<list.length;j++){
        const a=list[i], b=list[j];
        if(Utils.overlaps(Utils.timeToMin(a.start),Utils.timeToMin(a.end),Utils.timeToMin(b.start),Utils.timeToMin(b.end))){
          conflicts.push({a,b});
        }
      }
    }
    return conflicts;
  },
  apptHasConflict(appt){
    const conflicts = this.getConflicts(appt.date);
    return conflicts.some(c=>c.a.id===appt.id || c.b.id===appt.id);
  }
};

const PriorityEngine = {
  levelWeight:{critical:4, alta:3, media:2, baixa:1},
  scoreFromFactors(f){
    // f: {urgencia, importancia, impacto, prazo, dependencias} each 1-5
    const total = (f.urgencia||0)+(f.importancia||0)+(f.impacto||0)+(f.prazo||0)+(f.dependencias||0);
    return total; // 5-25
  },
  levelFromScore(total){
    if(total>=20) return 'critical';
    if(total>=14) return 'alta';
    if(total>=8) return 'media';
    return 'baixa';
  },
  countByLevel(items){
    const c={critical:0, alta:0, media:0, baixa:0};
    items.forEach(i=>{ if(c[i.priority]!==undefined) c[i.priority]++; });
    return c;
  }
};

/* ============================================================
   TIME INTELLIGENCE ENGINE — leitura de como o tempo executivo
   é utilizado em uma janela de dias (não apenas o que está
   marcado na agenda).
   ============================================================ */
const TimeIntelligenceEngine = {
  bucketOf(categoryId){
    const cat = State.getCategory(categoryId);
    if(!cat) return 'outro';
    if(cat.bucket) return cat.bucket;
    const parent = cat.parentId ? State.getCategory(cat.parentId) : null;
    return (parent && parent.bucket) || 'outro';
  },
  appointmentsInWindow(days){
    const start = Utils.addDays(new Date(), -Math.floor(days/2));
    const keys = new Set();
    for(let i=0;i<days;i++) keys.add(Utils.dateKey(Utils.addDays(start,i)));
    return State.appointments.filter(a=>keys.has(a.date));
  },
  weekWindow(){
    // segunda a domingo da semana corrente
    const now = new Date();
    const dow = now.getDay(); // 0=domingo
    const diffToMonday = (dow===0?-6:1-dow);
    const monday = Utils.addDays(now, diffToMonday);
    const keys = [];
    for(let i=0;i<7;i++) keys.push(Utils.dateKey(Utils.addDays(monday,i)));
    return State.appointments.filter(a=>keys.includes(a.date));
  },
  timeByBucket(list){
    const totals = {estrategico:0, operacional:0, pessoal:0, outro:0};
    list.forEach(a=>{
      const b = this.bucketOf(a.categoryId);
      const mins = Math.max(0, Utils.timeToMin(a.end)-Utils.timeToMin(a.start));
      totals[b] = (totals[b]||0) + mins;
    });
    return totals;
  },
  strategicProtectedMinutes(list){
    return list.filter(a=>this.bucketOf(a.categoryId)==='estrategico' && (a.priority==='critical'||a.priority==='alta'))
      .reduce((s,a)=>s+Math.max(0,Utils.timeToMin(a.end)-Utils.timeToMin(a.start)),0);
  },
  lowValueMinutes(list){
    return list.filter(a=>a.priority==='baixa')
      .reduce((s,a)=>s+Math.max(0,Utils.timeToMin(a.end)-Utils.timeToMin(a.start)),0);
  },
  priorityConflicts(list){
    // dias em que um compromisso de baixa/média prioridade concorre por tempo com um crítico/alto
    const byDate = {};
    list.forEach(a=>{ (byDate[a.date]=byDate[a.date]||[]).push(a); });
    let count = 0;
    Object.values(byDate).forEach(day=>{
      const high = day.filter(a=>a.priority==='critical'||a.priority==='alta');
      const low = day.filter(a=>a.priority==='baixa'||a.priority==='media');
      if(high.length && low.length){
        low.forEach(l=>{
          high.forEach(h=>{
            if(Utils.overlaps(Utils.timeToMin(l.start),Utils.timeToMin(l.end),Utils.timeToMin(h.start)-60,Utils.timeToMin(h.end)+60)) count++;
          });
        });
      }
    });
    return count;
  },
  overloadDays(list, dayStart, dayEnd){
    const byDate = {};
    list.forEach(a=>{ (byDate[a.date]=byDate[a.date]||[]).push(a); });
    const startMin = Utils.timeToMin(dayStart||State.settings.dayStart||'08:00');
    const endMin = Utils.timeToMin(dayEnd||State.settings.dayEnd||'20:00');
    const window = Math.max(1, endMin-startMin);
    const risky = [];
    Object.entries(byDate).forEach(([dk, items])=>{
      const busy = items.reduce((s,a)=>s+Math.max(0,Utils.timeToMin(a.end)-Utils.timeToMin(a.start)),0);
      const pct = Math.round((busy/window)*100);
      if(pct>=85) risky.push({date:dk, pct});
    });
    return risky.sort((a,b)=>b.pct-a.pct);
  },
  meetingCount(list){
    return list.filter(a=>this.bucketOf(a.categoryId)==='operacional' || this.bucketOf(a.categoryId)==='estrategico').length;
  },
  weeklyScore(list){
    // leitura simples e transparente — não é um índice de mercado, é uma bússola do protótipo
    const totals = this.timeByBucket(list);
    const totalMin = Object.values(totals).reduce((s,v)=>s+v,0) || 1;
    const strategicPct = (totals.estrategico/totalMin)*100;
    const lowValuePct = (this.lowValueMinutes(list)/totalMin)*100;
    const conflicts = this.priorityConflicts(list);
    const overload = this.overloadDays(list).length;
    let score = 55 + (strategicPct*0.5) - (lowValuePct*0.6) - (conflicts*4) - (overload*5);
    return Math.max(0, Math.min(100, Math.round(score)));
  }
};

/* ============================================================
   CONSIGNMENT ENGINE — reserva e acompanhamento de horas
   dedicadas a iniciativas e blocos de tempo para pensar.
   ============================================================ */
const ConsignmentEngine = {
  statusOf(ini){
    const necessarias = ini.horasNecessarias||0;
    const consignadas = ini.horasConsignadas||0;
    const utilizadas = ini.horasUtilizadas||0;
    if(necessarias>0 && utilizadas>=necessarias) return 'concluido';
    const prazo = ini.prazo ? Utils.parseDateKey(ini.prazo) : null;
    const diasRestantes = prazo ? Math.ceil((prazo - new Date())/86400000) : null;
    const restante = Math.max(0, necessarias - utilizadas);
    if(consignadas < necessarias*0.5) return 'risco';
    if(diasRestantes!==null && diasRestantes<=7 && restante > consignadas*0.3) return 'risco';
    if(consignadas < necessarias) return 'atencao';
    return 'no-prazo';
  },
  statusLabel(status){
    return {risco:'Em risco', atencao:'Atenção', 'no-prazo':'No prazo', concluido:'Concluído'}[status] || status;
  },
  withoutTime(){
    return State.initiatives.filter(i=>(i.horasConsignadas||0)===0 && this.statusOf(i)!=='concluido');
  },
  atRisk(){
    return State.initiatives.filter(i=>this.statusOf(i)==='risco');
  }
};

const SchedulingEngine = {
  // Finds first free slot >= durationMin within work hours, avoiding existing appointments
  findFreeSlot(dateKey, durationMin, dayStart, dayEnd){
    const list = State.apptsOnDate(dateKey);
    const startMin = Utils.timeToMin(dayStart||State.settings.dayStart||'08:00');
    const endMin = Utils.timeToMin(dayEnd||State.settings.dayEnd||'20:00');
    const busy = list.map(a=>[Utils.timeToMin(a.start), Utils.timeToMin(a.end)]).sort((x,y)=>x[0]-y[0]);
    let cursor = startMin;
    for(const [bStart,bEnd] of busy){
      if(bStart - cursor >= durationMin){
        return {start:Utils.minToTime(cursor), end:Utils.minToTime(cursor+durationMin)};
      }
      cursor = Math.max(cursor, bEnd);
    }
    if(endMin - cursor >= durationMin){
      return {start:Utils.minToTime(cursor), end:Utils.minToTime(cursor+durationMin)};
    }
    return null;
  },
  freeMinutesToday(dateKey, dayStart, dayEnd){
    const list = State.apptsOnDate(dateKey);
    const startMin = Utils.timeToMin(dayStart||State.settings.dayStart||'08:00');
    const endMin = Utils.timeToMin(dayEnd||State.settings.dayEnd||'20:00');
    let busy = 0;
    list.forEach(a=>{ busy += Math.max(0, Utils.timeToMin(a.end)-Utils.timeToMin(a.start)); });
    const totalWindow = Math.max(0, endMin-startMin);
    return {busy, free: Math.max(0,totalWindow-busy), window: totalWindow};
  }
};

const TimezoneEngine = {
  // rough IANA-based local time; falls back gracefully
  localTimeFor(dateKey, timeStr, tz){
    try{
      const [h,m] = timeStr.split(':').map(Number);
      const [y,mo,d] = dateKey.split('-').map(Number);
      const utcGuess = new Date(Date.UTC(y, mo-1, d, h, m));
      // We approximate: format the same instant into target tz for display purposes.
      return new Intl.DateTimeFormat('pt-BR', {hour:'2-digit', minute:'2-digit', timeZone: tz}).format(utcGuess);
    }catch(e){ return timeStr; }
  },
  // formata um relógio em tempo real, por fuso IANA (string) ou por offset fixo em minutos (number)
  liveParts(tzOrOffsetMinutes){
    const now = new Date();
    if(typeof tzOrOffsetMinutes === 'string'){
      try{
        const parts = new Intl.DateTimeFormat('pt-BR', {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false, timeZone:tzOrOffsetMinutes}).formatToParts(now);
        const get = t => (parts.find(p=>p.type===t)||{}).value || '--';
        const dateStr = new Intl.DateTimeFormat('pt-BR', {day:'2-digit', month:'short', timeZone:tzOrOffsetMinutes}).format(now);
        return {hh:get('hour'), mm:get('minute'), ss:get('second'), dateStr};
      }catch(e){ return {hh:'--',mm:'--',ss:'--',dateStr:'—'}; }
    }
    const utcMs = now.getTime() + now.getTimezoneOffset()*60000;
    const target = new Date(utcMs + tzOrOffsetMinutes*60000);
    return {hh:Utils.pad(target.getUTCHours()), mm:Utils.pad(target.getUTCMinutes()), ss:Utils.pad(target.getUTCSeconds()), dateStr:Utils.fmtDateShort(target)};
  }
};

/* ============================================================
   RouteEngine — trajeto, veículo e tempo de deslocamento
   (distâncias calculadas por coordenadas aproximadas das cidades
   cadastradas; heurística de veículo simulada para o protótipo)
   ============================================================ */
const CITY_COORDS = {
  'São Paulo':       {lat:-23.5505, lng:-46.6333},
  'Rio de Janeiro':  {lat:-22.9068, lng:-43.1729},
  'Brasília':        {lat:-15.7939, lng:-47.8828},
  'Nova York':       {lat:40.7128,  lng:-74.0060},
  'Londres':         {lat:51.5074,  lng:-0.1278},
  'Tóquio':          {lat:35.6762,  lng:139.6503},
  'Dubai':           {lat:25.2048,  lng:55.2708},
  'Singapura':       {lat:1.3521,   lng:103.8198},
  'Frankfurt':       {lat:50.1109,  lng:8.6821},
  'Hong Kong':       {lat:22.3193,  lng:114.1694}
};
const CATEGORY_LABELS = {
  carro_local:'Carro executivo (trajeto local)',
  carro_rodovia:'Carro executivo (rodovia)',
  helicoptero:'Helicóptero executivo',
  jato_domestico:'Jato executivo (voo doméstico)',
  jato_internacional:'Jato executivo (voo internacional)'
};
const RouteEngine = {
  distanceKm(cityA, cityB){
    if(!cityA || !cityB) return null;
    if(cityA===cityB) return null; // mesma cidade: trajeto local, não se aplica distância entre cidades
    const a = CITY_COORDS[cityA], b = CITY_COORDS[cityB];
    if(!a || !b) return null;
    const R=6371;
    const dLat=(b.lat-a.lat)*Math.PI/180, dLng=(b.lng-a.lng)*Math.PI/180;
    const lat1=a.lat*Math.PI/180, lat2=b.lat*Math.PI/180;
    const h = Math.sin(dLat/2)**2 + Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;
    return Math.round(2*R*Math.asin(Math.sqrt(h)));
  },
  suggestCategory(originLoc, destLoc, distanceKm){
    const sameCity = originLoc.cidade === destLoc.cidade;
    if(sameCity){
      // sem distância entre cidades: decide pelo tempo médio de deslocamento cadastrado no local
      return (destLoc.deslocamento||0) > 30 ? 'helicoptero' : 'carro_local';
    }
    const samePais = originLoc.pais === destLoc.pais;
    if(!samePais) return 'jato_internacional';
    return (distanceKm!=null && distanceKm>250) ? 'jato_domestico' : 'carro_rodovia';
  },
  vehicleFor(category){
    return (State.fleet||[]).find(v=>v.categoria===category) || null;
  },
  estimateDurationMin(category, vehicle, distanceKm, destLoc){
    if(category==='carro_local'){
      // trajeto local: usa o tempo médio de deslocamento já cadastrado no local (em minutos)
      return Math.max(8, destLoc.deslocamento || 15);
    }
    const speed = (vehicle && vehicle.velocidadeMediaKmh) || 60;
    if(category==='helicoptero'){
      // distância local estimada a partir do tempo de deslocamento de carro (velocidade urbana ~28 km/h)
      const localKm = Math.max(6, Math.round((destLoc.deslocamento||40)/60*28));
      return Math.max(12, Math.round(localKm/speed*60) + 15);
    }
    if(category==='carro_rodovia'){
      const km = distanceKm || 150;
      return Math.max(30, Math.round(km/speed*60) + 10);
    }
    if(category==='jato_internacional'){
      const km = distanceKm || 9000;
      return Math.round(km/speed*60) + 150; // + imigração/alfândega
    }
    const km = distanceKm || 400;
    return Math.round(km/speed*60) + 75; // + check-in/embarque doméstico
  },
  // encontra o local do compromisso imediatamente anterior no mesmo dia; senão, usa a base do executivo
  originForAppt(appt){
    const dayList = State.apptsOnDate(appt.date).filter(a=>a.id!==appt.id && a.location && !a.virtual);
    const before = dayList.filter(a=>Utils.timeToMin(a.end)<=Utils.timeToMin(appt.start)).sort((x,y)=>Utils.timeToMin(y.end)-Utils.timeToMin(x.end));
    if(before.length) return before[0].location;
    return State.settings.homeBaseLocationId || (State.locations[0] && State.locations[0].id);
  },
  getRoute(appt){
    if(!appt.location || appt.virtual) return null;
    const originId = this.originForAppt(appt);
    if(!originId || originId === appt.location) return null;
    const originLoc = State.getLocation(originId);
    const destLoc = State.getLocation(appt.location);
    if(!originLoc || !destLoc) return null;
    const distanceKm = this.distanceKm(originLoc.cidade, destLoc.cidade);
    const category = this.suggestCategory(originLoc, destLoc, distanceKm);
    const vehicle = this.vehicleFor(category);
    const durationMin = this.estimateDurationMin(category, vehicle, distanceKm, destLoc);
    return {originLoc, destLoc, distanceKm, category, categoryLabel:CATEGORY_LABELS[category], vehicle, durationMin};
  }
};
function vehicleIcon(category){
  if(category==='jato_domestico' || category==='jato_internacional'){
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M10.5 3 8 9l-6 2v2l6-1 1 5-2 1.5V20l3-1 3 1v-1.5L11 17l1-5 6 1v-2l-6-2-2.5-6z"/></svg>`;

function priorityLabel(p){ return {critical:'Crítica', alta:'Alta', media:'Média', baixa:'Baixa'}[p] || p; }

function categoryPath(catId){
  const path = [];
  let cur = State.getCategory(catId);
  while(cur){ path.unshift(cur.name); cur = cur.parentId ? State.getCategory(cur.parentId) : null; }
  return path.join(' / ') || '—';
}

function personNames(ids){
  if(!ids || !ids.length) return '—';
  return ids.map(id=>{ const p=State.getPerson(id); return p?p.nome:id; }).join(', ');
}

function locationName(id){
  if(!id) return '—';
  const l = State.getLocation(id);
  return l ? l.nome : '—';
}

// Abreviação curta do fuso a partir do identificador IANA (ex: America/Sao_Paulo -> Sao_Paulo)
function tzShort(tz){
  if(!tz) return '';
  const parts = tz.split('/');
  return parts[parts.length-1].replace(/_/g,' ');
}

function locationWithTz(id){
  if(!id) return '—';
  const l = State.getLocation(id);
  if(!l) return '—';
  return `${l.nome} · ${Utils.escape(tzShort(l.fuso))}`;
}

function tickWorldClocks(){
  const panel = document.getElementById('worldClockPanel');
  if(!panel){ if(worldClockTimer){ clearInterval(worldClockTimer); worldClockTimer=null; } return; }
  panel.querySelectorAll('.wc-card').forEach((card,i)=>{
    const mode = card.dataset.wcMode;
    const raw = card.dataset.wcValue;
    const value = mode==='tz' ? raw : Number(raw);
    const {hh,mm,ss,dateStr} = TimezoneEngine.liveParts(value);
    const timeEl = document.getElementById('wcTime'+i);
    const dateEl = document.getElementById('wcDate'+i);
    if(timeEl) timeEl.innerHTML = `${hh}:${mm}<span class="secs">:${ss}</span>`;
    if(dateEl) dateEl.textContent = dateStr;
  });
}

  if(worldClockTimer) clearInterval(worldClockTimer);
  tickWorldClocks();

function renderAgendaDay(dk){
  const list = State.apptsOnDate(dk);
  const conflicts = ConflictEngine.getConflicts(dk);
  const conflictIds = new Set();
  conflicts.forEach(c=>{ conflictIds.add(c.a.id); conflictIds.add(c.b.id); });

  const startH = 7, endH = 21;
  const slotH = State.settings.slotHeight || 72;
  const totalMin = (endH-startH)*60;

  let hoursHtml = '';
  for(let h=startH; h<endH; h++){ hoursHtml += `<div class="timeline-hour"><span>${Utils.pad(h)}:00</span></div>`; }

  let gridLines = '';
  for(let h=startH; h<endH; h++){ gridLines += `<div class="timeline-grid-line half" style="top:${(h-startH)*slotH}px"></div>`; }

  let blocksHtml = '';
  list.forEach(a=>{
    const sMin = Utils.timeToMin(a.start) - startH*60;
    const eMin = Utils.timeToMin(a.end) - startH*60;
    if(eMin<=0 || sMin>=totalMin) return;
    const top = Math.max(0,sMin) / 60 * slotH;
    const height = Math.max(28, (eMin-Math.max(0,sMin))/60*slotH - 2);
    const compact = height < 44;
    const route = RouteEngine.getRoute(a);
    const routeLine = (route && !compact) ? `<div class="sub-route">${vehicleIconSmall(route.category)} ${Utils.escape(routeVehicleLabel(route))} · ${Utils.fmtDuration(route.durationMin)}</div>` : '';
    blocksHtml += `
      <div class="appt-block p-${a.priority} ${conflictIds.has(a.id)?'conflict':''} ${compact?'compact':''}" style="top:${top}px; height:${height}px;" data-open-appt="${a.id}">
        <div class="t">${a.start} – ${a.end}</div>
        <div class="ttl">${Utils.escape(a.title)}</div>
        <div class="sub">${a.virtual ? 'Virtual' : Utils.escape(locationWithTz(a.location))} · ${Utils.escape(categoryPath(a.categoryId))}</div>
        ${routeLine}
      </div>`;
  });

  // now line
  let nowLineHtml = '';
  const now = new Date();
  const nowMin = now.getHours()*60+now.getMinutes() - startH*60;
  if(Utils.dateKey(now)===dk && nowMin>=0 && nowMin<=totalMin){
    nowLineHtml = `<div class="now-line" style="top:${nowMin/60*slotH}px"></div>`;
  }

  const conflictBanner = conflicts.length ? `
    <div class="conflict-banner">
      <span>⚠</span>
      <span>${conflicts.length} conflito(s) de agenda detectado(s) neste dia. Abra os compromissos destacados para revisar.</span>
    </div>` : '';

  return `
    ${conflictBanner}
    <div class="timeline-wrap" style="height:${(endH-startH)*slotH}px">
      <div class="timeline-rail">${hoursHtml}</div>
      <div class="timeline-body" style="height:${(endH-startH)*slotH}px">
        ${gridLines}
        ${blocksHtml}
        ${nowLineHtml}
      </div>
    </div>
  `;
}

function renderAgendaWeek(){
  const start = Utils.startOfWeek(State.currentDate);
  const days = [...Array(7)].map((_,i)=>Utils.addDays(start,i));
  const todayKey = Utils.dateKey(new Date());
  const diaAbrev = ['SEG','TER','QUA','QUI','SEX','SÁB','DOM'];

  let head = `<div class="week-head week-corner"></div>`;
  days.forEach((d,i)=>{
    const isToday = Utils.dateKey(d)===todayKey;
    head += `<div class="week-head ${isToday?'today':''}"><div class="d">${diaAbrev[i]}</div><div class="n">${d.getDate()}</div></div>`;
  });

  let cols = `<div class="week-col week-corner" style="min-height:1px"></div>`;
  days.forEach(d=>{
    const dk = Utils.dateKey(d);
    const list = State.apptsOnDate(dk);
    const chips = list.map(a=>`
      <div class="week-chip p-${a.priority}" data-open-appt="${a.id}">
        <div class="wt">${a.start}</div>
        <div class="wtl">${Utils.escape(a.title)}</div>
      </div>`).join('') || `<div class="small text-tertiary" style="padding:6px 2px">—</div>`;
    cols += `<div class="week-col">${chips}</div>`;
  });

  return `<div class="week-grid">${head}${cols}</div>`;
}

        <div class="view-title-sub">Organize por status — arraste os cartões entre colunas</div>

    <div class="kanban">${colHtml}</div>
  `;
  document.getElementById('newTaskBtn').addEventListener('click', ()=>openTaskModal(null));
  document.querySelectorAll('.kanban-card').forEach(card=>{
    card.addEventListener('click', ()=>openTaskModal(card.dataset.task));
    card.addEventListener('dragstart', e=>{ e.dataTransfer.setData('text/plain', card.dataset.task); });
  });
  document.querySelectorAll('.kanban-col').forEach(col=>{
    col.addEventListener('dragover', e=>{ e.preventDefault(); col.classList.add('dragover'); });

  const rows = items.map((t,idx)=>`

      e.stopPropagation();
      const t = State.tasks.find(x=>x.id===el.dataset.suggest);
      const dk = Utils.dateKey(new Date());
      const slot = SchedulingEngine.findFreeSlot(dk, t.duracao);

/* ============================================================
   RENDER: CATEGORIES (hierarchical tree)
   ============================================================ */
function renderCategoriesView(){
  function countUsage(catId){
    return State.appointments.filter(a=>a.categoryId===catId).length + State.tasks.filter(t=>t.categoryId===catId).length;
  }
  function renderNode(cat, depth){
    const children = State.categories.filter(c=>c.parentId===cat.id);
    return `
      <div class="cat-node">
        <div class="cat-row">
          <span class="cat-color" style="background:${cat.color||'#6C7FA0'}"></span>
          <span class="cat-name">${Utils.escape(cat.name)}</span>
          <span class="cat-count">${countUsage(cat.id)} uso(s)</span>
          <div class="cat-actions">
            <button class="icon-btn btn-sm" data-add-sub="${cat.id}" title="Nova subcategoria"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M12 5v14M5 12h14"/></svg></button>
            <button class="icon-btn btn-sm" data-edit-cat="${cat.id}" title="Editar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" width="12" height="12"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
            <button class="icon-btn btn-sm" data-del-cat="${cat.id}" title="Excluir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="12" height="12"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m-8 0 1 13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1l1-13"/></svg></button>
          </div>
        </div>
        ${children.length ? `<div class="cat-children">${children.map(c=>renderNode(c,depth+1)).join('')}</div>` : ''}
      </div>`;
  }
  const roots = State.categories.filter(c=>!c.parentId);
  document.getElementById('viewContainer').innerHTML = `
    <div class="view-header">
      <div><div class="view-title">Categorias</div><div class="view-title-sub">Estrutura hierárquica — trabalho, pessoal e níveis adicionais</div></div>
      <button class="btn btn-primary" id="newCatBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>Nova categoria</button>
    </div>
    <div class="cat-tree">${roots.map(c=>renderNode(c,0)).join('') || emptyState('Nenhuma categoria','Crie a primeira categoria para organizar compromissos e tarefas.')}</div>
  `;
  document.getElementById('newCatBtn').addEventListener('click', ()=>openCategoryModal(null,null));
  document.querySelectorAll('[data-add-sub]').forEach(el=>el.addEventListener('click',()=>openCategoryModal(null, el.dataset.addSub)));
  document.querySelectorAll('[data-edit-cat]').forEach(el=>el.addEventListener('click',()=>openCategoryModal(el.dataset.editCat,null)));
  document.querySelectorAll('[data-del-cat]').forEach(el=>el.addEventListener('click',()=>{
    const hasChildren = State.categories.some(c=>c.parentId===el.dataset.delCat);
    if(hasChildren){ toast('Exclua as subcategorias antes de remover esta categoria.', 'danger'); return; }
    confirmDelete('categoria', ()=>{
      State.categories = State.categories.filter(c=>c.id!==el.dataset.delCat);
      State.persist(); toast('Categoria excluída.'); renderCurrentView();
    });
  }));
}

/* ============================================================
   RENDER: TIME INTELLIGENCE
   ============================================================ */
function renderIntelligenceView(){
  const week = TimeIntelligenceEngine.weekWindow();
  const totals = TimeIntelligenceEngine.timeByBucket(week);
  const totalMin = Object.values(totals).reduce((s,v)=>s+v,0) || 1;
  const score = TimeIntelligenceEngine.weeklyScore(week);
  const conflicts = TimeIntelligenceEngine.priorityConflicts(week);
  const overload = TimeIntelligenceEngine.overloadDays(week);
  const lowValue = TimeIntelligenceEngine.lowValueMinutes(week);
  const lowValuePct = Math.round((lowValue/totalMin)*100);

  const bucketLabels = {estrategico:'Estratégico', operacional:'Operacional', pessoal:'Pessoal', outro:'Outro'};
  const bucketColors = {estrategico:'var(--available)', operacional:'var(--medium)', pessoal:'var(--accent)', outro:'var(--low)'};
  const maxBucket = Math.max(...Object.values(totals), 1);

  const distributionHtml = Object.entries(totals).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
    <div class="bar-row">
      <div class="bar-label">${bucketLabels[k]||k}</div>
      <div class="bar-track"><div class="bar-fill" style="width:${(v/maxBucket)*100}%; background:${bucketColors[k]||'var(--medium)'};"></div></div>
      <div class="bar-val">${Utils.fmtDuration(v)}</div>
    </div>`).join('') || `<div class="small text-tertiary">Sem compromissos nesta semana.</div>`;

  const counts = PriorityEngine.countByLevel(week);
  const maxCount = Math.max(counts.critical, counts.alta, counts.media, counts.baixa, 1);
  const priorityHtml = `
    <div class="bar-row"><div class="bar-label">Crítica</div><div class="bar-track"><div class="bar-fill" style="width:${(counts.critical/maxCount)*100}%; background:var(--critical);"></div></div><div class="bar-val">${counts.critical}</div></div>
    <div class="bar-row"><div class="bar-label">Alta</div><div class="bar-track"><div class="bar-fill" style="width:${(counts.alta/maxCount)*100}%; background:var(--high);"></div></div><div class="bar-val">${counts.alta}</div></div>
    <div class="bar-row"><div class="bar-label">Média</div><div class="bar-track"><div class="bar-fill" style="width:${(counts.media/maxCount)*100}%; background:var(--medium);"></div></div><div class="bar-val">${counts.media}</div></div>
    <div class="bar-row"><div class="bar-label">Baixa</div><div class="bar-track"><div class="bar-fill" style="width:${(counts.baixa/maxCount)*100}%; background:var(--low);"></div></div><div class="bar-val">${counts.baixa}</div></div>
  `;

  document.getElementById('viewContainer').innerHTML = `
    <div class="view-header"><div><div class="view-title">Time Intelligence</div><div class="view-title-sub">Como o tempo está sendo utilizado — não apenas o que está marcado na agenda</div></div></div>

    <div class="indicators">
      <div class="indicator accent"><div class="num">${score}</div><div class="lbl">Leitura da semana</div></div>
      <div class="indicator ${lowValuePct>25?'crit':''}"><div class="num">${lowValuePct}%</div><div class="lbl">Tempo de baixo valor</div></div>
      <div class="indicator ${conflicts>0?'crit':''}"><div class="num">${conflicts}</div><div class="lbl">Conflitos de prioridade</div></div>
      <div class="indicator ${overload.length?'crit':''}"><div class="num">${overload.length}</div><div class="lbl">Dias em risco de sobrecarga</div></div>
    </div>

    <div class="ov-grid">
      <div class="panel">
        <div class="panel-label"><span class="eyebrow">Distribuição do tempo</span></div>
        ${distributionHtml}
      </div>
      <div class="panel">
        <div class="panel-label"><span class="eyebrow">Análise de prioridades</span></div>
        ${priorityHtml}
      </div>
    </div>

    <div class="panel">
      <div class="priority-vs">
        <span class="pv-word">Prioridade</span><span class="pv-neq">≠</span><span class="pv-word">Urgência</span>
      </div>
      <div class="small text-tertiary" style="text-align:center;">${lowValuePct}% do tempo desta semana está em compromissos de baixa relevância. Isso não significa que a agenda está errada — significa que vale revisar o que está protegido e o que está apenas ocupando espaço.</div>
    </div>

    ${renderMalhaTemporalPanel()}
  `;
  document.querySelectorAll('[data-goto-view]').forEach(el=>{
    el.addEventListener('click', ()=>{ State.currentView = el.dataset.gotoView; renderCurrentView(); });
  });
}

/* ============================================================
   RENDER: CONSIGNAÇÃO TEMPORAL
   ============================================================ */
function renderConsignmentView(){
  const items = State.initiatives.slice().sort((a,b)=>{
    const order = {risco:0, atencao:1, 'no-prazo':2, concluido:3};
    return order[ConsignmentEngine.statusOf(a)] - order[ConsignmentEngine.statusOf(b)];
  });
  const atRisk = ConsignmentEngine.atRisk();
  const withoutTime = ConsignmentEngine.withoutTime();
  const thinkingItems = items.filter(i=>i.tipo==='pensar');

  const cardsHtml = items.map(ini=>{
    const status = ConsignmentEngine.statusOf(ini);
    const necessarias = ini.horasNecessarias||0;
    const consignadas = Math.min(ini.horasConsignadas||0, necessarias||ini.horasConsignadas||0);
    const utilizadas = Math.min(ini.horasUtilizadas||0, necessarias||ini.horasUtilizadas||0);
    const restantes = Math.max(0, necessarias - utilizadas);
    const pctUsed = necessarias? (utilizadas/necessarias)*100 : 0;
    const pctConsigned = necessarias? (consignadas/necessarias)*100 : 0;
    const tipoLabel = {estrategico:'Iniciativa estratégica', operacional:'Iniciativa operacional', pensar:'Tempo para pensar'}[ini.tipo] || 'Iniciativa';
    const thinkingSlots = ini.tipo==='pensar' && ini.blocos ? `
      <div class="thinking-slots">
        ${Array.from({length:ini.blocos}).map((_,i)=>`<span class="thinking-slot">Bloco ${i+1} · ${ini.blocoHoras}h</span>`).join('')}
      </div>` : '';
    return `
      <div class="consign-card">
        <div class="consign-top">
          <div>
            <div class="consign-title">${Utils.escape(ini.titulo)}</div>
            <div class="consign-type">${tipoLabel}${ini.prazo? ' · prazo em '+Utils.parseDateKey(ini.prazo).toLocaleDateString('pt-BR') : ''}</div>
          </div>
          <span class="status-badge ${status}">${ConsignmentEngine.statusLabel(status)}</span>
        </div>
        <div class="consign-track">
          <div class="consign-seg consigned" style="width:${pctConsigned}%"></div>
          <div class="consign-seg used" style="width:${pctUsed}%"></div>
        </div>
        <div class="consign-meta">
          <div class="meta-item"><span class="k">Necessário</span><span class="v">${necessarias}h</span></div>
          <div class="meta-item"><span class="k">Consignado</span><span class="v">${ini.horasConsignadas||0}h</span></div>
          <div class="meta-item"><span class="k">Utilizado</span><span class="v">${ini.horasUtilizadas||0}h</span></div>
          <div class="meta-item"><span class="k">Restante</span><span class="v">${restantes}h</span></div>
        </div>
        ${thinkingSlots}
        ${ini.obs? `<div class="small text-tertiary" style="margin-top:10px;">${Utils.escape(ini.obs)}</div>` : ''}
        <div class="consign-actions">
          <button class="btn btn-sm" data-edit-ini="${ini.id}">Editar</button>
          <button class="btn btn-sm btn-danger" data-del-ini="${ini.id}">Excluir</button>
        </div>
      </div>`;
  }).join('') || `<div class="small text-tertiary">Nenhuma iniciativa consignada ainda.</div>`;

  document.getElementById('viewContainer').innerHTML = `
    <div class="view-header">
      <div><div class="view-title">Consignação Temporal</div><div class="view-title-sub">Reserve, atribua e acompanhe o tempo dedicado às suas iniciativas</div></div>
      <button class="btn btn-primary" id="newIniBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>Nova iniciativa
      </button>
    </div>

    <div class="indicators">
      <div class="indicator ${atRisk.length?'crit':''}"><div class="num">${atRisk.length}</div><div class="lbl">Em risco</div></div>
      <div class="indicator ${withoutTime.length?'crit':''}"><div class="num">${withoutTime.length}</div><div class="lbl">Sem tempo alocado</div></div>
      <div class="indicator"><div class="num">${thinkingItems.length}</div><div class="lbl">Blocos de tempo para pensar</div></div>
      <div class="indicator"><div class="num">${items.length}</div><div class="lbl">Iniciativas ativas</div></div>
    </div>

    ${withoutTime.length? `
    <div class="panel alerts-panel">
      <div class="panel-label"><span class="eyebrow">Uma ideia sem tempo alocado tende a permanecer apenas uma intenção</span></div>
      ${withoutTime.map(i=>`<div class="alert-row"><span class="alert-dot warn"></span><span class="alert-text">Você possui a iniciativa "<b>${Utils.escape(i.titulo)}</b>" sem tempo formalmente reservado.</span></div>`).join('')}
    </div>` : ''}

    <div class="consign-list">${cardsHtml}</div>
  `;
  document.getElementById('newIniBtn').addEventListener('click', ()=>openInitiativeModal(null));
  document.querySelectorAll('[data-edit-ini]').forEach(el=> el.addEventListener('click', ()=>openInitiativeModal(el.dataset.editIni)));
  document.querySelectorAll('[data-del-ini]').forEach(el=> el.addEventListener('click', ()=>{
    confirmDelete('esta iniciativa', ()=>{
      State.initiatives = State.initiatives.filter(i=>i.id!==el.dataset.delIni);
      State.persist(); toast('Iniciativa excluída.'); renderCurrentView();
    });
  }));
}

        <thead><tr><th>Dia</th><th>Início</th><th>Fim</th><th>Janela reuniões 1 — início</th><th>fim</th><th>Janela reuniões 2 — início</th><th>fim</th></tr></thead>

    </div>
  `;
  document.querySelectorAll('[data-avail-active]').forEach(cb=>{

    toast('Disponibilidade salva.');
