        <button class="btn" id="exportBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3v12m0 0-4-4m4 4 4-4M4 19h16"/></svg>Exportar dados (JSON)</button>
        <label class="btn" style="cursor:pointer;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21V9m0 0 4 4m-4-4-4 4M4 5h16"/></svg>Importar dados (JSON)
          <input type="file" id="importInput" accept="application/json" class="hidden">
        </label>
        <button class="btn btn-danger" id="resetBtn">Restaurar dados de demonstração</button>
      </div>
    </div>

    <div class="panel mt8">
      <div class="panel-label"><span class="eyebrow">Janela padrão da agenda</span></div>
      <div class="form-grid">
        <div class="field"><label>Início do dia</label><input type="time" id="setDayStart" value="${State.settings.dayStart||'08:00'}"></div>
        <div class="field"><label>Fim do dia</label><input type="time" id="setDayEnd" value="${State.settings.dayEnd||'20:00'}"></div>
      </div>
      <div class="field"><label>Local-base do executivo (origem padrão dos trajetos)</label>
        <select id="setHomeBase">
          ${State.locations.map(l=>`<option value="${l.id}" ${State.settings.homeBaseLocationId===l.id?'selected':''}>${Utils.escape(l.nome)} — ${Utils.escape(l.cidade)}</option>`).join('')}
        </select>
      </div>
      <button class="btn btn-primary btn-sm" id="saveSettingsBtn">Salvar preferências</button>
    </div>

    <div class="panel mt8">
      <div class="panel-label"><span class="eyebrow">Fusos horários principais — Visão Geral</span></div>
      <p class="small text-tertiary" style="margin-bottom:14px;">Brasília e Nova York são exibidos como referências fixas na tela inicial. O terceiro relógio é o <b>Fuso Pessoal</b>: uma referência própria e estável do executivo, útil para fins organizacionais quando ele transita entre vários fusos.</p>
      <div class="form-grid">
        <div class="field"><label>Rótulo do fuso pessoal</label><input type="text" id="setPersonalTzLabel" value="${Utils.escape(State.settings.personalTz?.label || 'Fuso Pessoal')}"></div>
        <div class="field"><label>Deslocamento em relação ao UTC</label>
          <select id="setPersonalTzOffset">
            ${Array.from({length:27}, (_,i)=>i-12).map(h=>{
              const val = h*60;
              const sel = (State.settings.personalTz?.offsetMinutes ?? -180) === val ? 'selected' : '';
              return `<option value="${val}" ${sel}>UTC${h>=0?'+':''}${h}:00</option>`;
            }).join('')}
          </select>
        </div>
      </div>
      <button class="btn btn-primary btn-sm" id="saveWorldClockBtn">Salvar fuso pessoal</button>
    </div>

    <div class="panel mt8">
      <div class="panel-label"><span class="eyebrow">Sobre</span></div>
      <div class="small text-tertiary">Time Guardian · Executive Time Intelligence — protótipo funcional v0.2. Arquivo único, sem backend, pensado para evoluir para uma plataforma completa de inteligência e governança do tempo executivo.</div>
    </div>

    <div class="panel mt8">
      <div class="panel-label"><span class="eyebrow">Human + System</span></div>
      <div class="thesis-block">
        <p>O Time Guardian não substitui assessores executivos, secretários, gatekeepers ou chiefs of staff — ele trabalha ao lado deles.</p>
        <div class="thesis-cols">
          <div>
            <div class="thesis-col-title">O profissional humano</div>
            <ul><li>interpreta</li><li>negocia</li><li>decide</li></ul>
          </div>
          <div>
            <div class="thesis-col-title">O sistema</div>
            <ul><li>analisa</li><li>acompanha</li><li>alerta</li><li>organiza</li><li>simula</li></ul>
          </div>
        </div>
      </div>
    </div>
  `;
  document.getElementById('exportBtn').addEventListener('click', ()=>{ Storage.exportJSON(State); toast('Exportação iniciada.'); });
  document.getElementById('importInput').addEventListener('change', (e)=>{
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = ()=>{
      try{
        const data = JSON.parse(reader.result);
        ['appointments','tasks','categories','people','locations','availability','settings'].forEach(k=>{
          if(data[k]) State[k] = data[k];
        });
        State.persist();
        toast('Dados importados com sucesso.');
        renderCurrentView(); updateTopbar();
      }catch(err){ toast('Arquivo inválido.', 'danger'); }
    };
    reader.readAsText(file);
  });
  document.getElementById('resetBtn').addEventListener('click', ()=>{
    confirmDelete('todos os dados (restaurando a demonstração)', ()=>{
      const demo = buildDemoData();
      Object.assign(State, demo);
      State.persist();
      toast('Dados de demonstração restaurados.');
      renderCurrentView(); updateTopbar();
    });
  });
  document.getElementById('saveSettingsBtn').addEventListener('click', ()=>{
    State.settings.dayStart = document.getElementById('setDayStart').value;
    State.settings.dayEnd = document.getElementById('setDayEnd').value;
    State.settings.homeBaseLocationId = document.getElementById('setHomeBase').value;
    State.persist(); toast('Preferências salvas.'); updateTopbar();
  });
  document.getElementById('saveWorldClockBtn').addEventListener('click', ()=>{
    const label = document.getElementById('setPersonalTzLabel').value.trim() || 'Fuso Pessoal';
    const offsetMinutes = Number(document.getElementById('setPersonalTzOffset').value);
    State.settings.personalTz = {label, offsetMinutes};
    State.persist();
    toast('Fuso pessoal atualizado.');
    if(State.currentView==='overview') renderOverview();
  });
}

/* ============================================================
   MODALS — Appointment
   ============================================================ */
function openApptModal(id){
  State.editingApptId = id;
  const a = id ? State.appointments.find(x=>x.id===id) : {
    id:null, title:'', type:'Interno', date:Utils.dateKey(State.currentDate), start:'09:00', end:'09:30',
    categoryId: State.categories[0]?.id || '', priority:'media', status:'Pendente',
    participants:[], responsavel:'', externos:'', grupo:'', location:'', virtual:false,
    objetivo:'', obs:'', preparacao:'', materiais:'', link:'', recorrencia:'Nenhuma', lembrete:'Nenhum',
    dependencias:'', tarefaRelacionada:'', delegavel:false, remarcavel:true, tzParticipants:[], registradoPor:''
  };

  const conflict = a.id ? ConflictEngine.apptHasConflict(a) : false;

  const catOptions = State.categories.map(c=>`<option value="${c.id}" ${a.categoryId===c.id?'selected':''}>${Utils.escape(categoryPath(c.id))}</option>`).join('');
  const locOptions = `<option value="">—</option>` + State.locations.map(l=>`<option value="${l.id}" ${a.location===l.id?'selected':''}>${Utils.escape(l.nome)}</option>`).join('');
  const peopleChecks = State.people.map(p=>`
    <label class="checkbox-row"><input type="checkbox" value="${p.id}" class="ppl-check" ${a.participants.includes(p.id)?'checked':''}> ${Utils.escape(p.nome)} <span class="text-tertiary small">(${Utils.escape(p.empresa)})</span></label>
  `).join('');
  const respOptions = `<option value="">—</option>` + State.people.map(p=>`<option value="${p.id}" ${a.responsavel===p.id?'selected':''}>${Utils.escape(p.nome)}</option>`).join('');

  const tzHtml = (a.tzParticipants&&a.tzParticipants.length) ? a.tzParticipants.map(tz=>`
    <div class="tz-row"><span class="city">${Utils.escape(tz.cidade)}</span><span class="time">${TimezoneEngine.localTimeFor(a.date, a.start, tz.fuso)}</span></div>
  `).join('') : '<div class="small text-tertiary">Nenhum fuso adicional vinculado a esta reunião.</div>';

  const html = `
    <div class="modal-head">
      <h3>${a.id ? 'Editar compromisso' : 'Novo compromisso'}</h3>
      <button class="icon-btn" id="closeModalBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
    <div class="modal-body">
      ${conflict ? `<div class="conflict-banner">⚠ Este compromisso está em <b>conflito de horário</b> com outro item da agenda.
        <div class="conflict-actions">
          <button class="btn btn-sm" id="suggestReschedule">Sugerir novo horário</button>
        </div>
      </div>` : ''}

      <div class="form-section">
        <div class="form-section-title">Informações básicas</div>
        <div class="field full"><label>Título</label><input type="text" id="f_title" value="${Utils.escape(a.title)}" placeholder="Ex: Reunião com Diretoria"></div>
        <div class="form-grid c3">
          <div class="field"><label>Tipo</label><select id="f_type">
            ${['Interno','Cliente','Fornecedor','Pessoal','Externo'].map(t=>`<option ${a.type===t?'selected':''}>${t}</option>`).join('')}
          </select></div>
          <div class="field"><label>Data</label><input type="date" id="f_date" value="${a.date}"></div>
          <div class="field"><label>Status</label><select id="f_status">
            ${['Pendente','Confirmado','Concluído','Cancelado'].map(t=>`<option ${a.status===t?'selected':''}>${t}</option>`).join('')}
          </select></div>
        </div>
        <div class="form-grid c3">
          <div class="field"><label>Hora inicial</label><input type="time" id="f_start" value="${a.start}"></div>
          <div class="field"><label>Hora final</label><input type="time" id="f_end" value="${a.end}"></div>
          <div class="field"><label>Duração</label><input type="text" id="f_duration" value="${Utils.fmtDuration(Utils.timeToMin(a.end)-Utils.timeToMin(a.start))}" disabled></div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Classificação</div>
        <div class="form-grid">
          <div class="field"><label>Categoria / Subcategoria</label><select id="f_category">${catOptions}</select></div>
          <div class="field"><label>Prioridade</label>
            <div class="pill-select" id="f_priority">
              ${['critical','alta','media','baixa'].map(p=>`<div class="pill-opt ${a.priority===p?'sel':''}" data-val="${p}">${priorityLabel(p)}</div>`).join('')}
            </div>
          </div>
        </div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Pessoas</div>
        <div class="form-grid">
          <div class="field"><label>Responsável</label><select id="f_responsavel">${respOptions}</select></div>
          <div class="field"><label>Grupo / equipe</label><input type="text" id="f_grupo" value="${Utils.escape(a.grupo)}"></div>
        </div>
        <div class="field full"><label>Pessoas externas</label><input type="text" id="f_externos" value="${Utils.escape(a.externos)}" placeholder="Ex: Empresa X, Consultoria Y"></div>
        <div class="field full"><label>Participantes</label><div style="display:flex; flex-direction:column; gap:6px; max-height:130px; overflow:auto; border:1px solid var(--border); border-radius:4px; padding:8px;">${peopleChecks}</div></div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Localização</div>
        <div class="form-grid">
          <div class="field"><label>Local cadastrado</label><select id="f_location">${locOptions}</select></div>
          <div class="field"><label class="checkbox-row" style="margin-top:22px;"><input type="checkbox" id="f_virtual" ${a.virtual?'checked':''}> Reunião virtual</label></div>
        </div>
        <div id="locDetailBox"></div>
        <div class="route-toggle hidden" id="routeToggleBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12h4l2-7 4 14 2-7h6"/></svg>
          <span id="routeToggleLabel">Ver trajeto até este compromisso</span>
        </div>
        <div class="route-panel hidden" id="routePanelBox"></div>
        ${tzHtml ? `<div class="field full mt8"><label>Horários por fuso (reunião global)</label><div style="border:1px solid var(--border); border-radius:4px; padding:6px 10px;">${tzHtml}</div></div>` : ''}
      </div>

      <div class="form-section">
        <div class="form-section-title">Contexto</div>
        <div class="field full"><label>Objetivo</label><textarea id="f_objetivo">${Utils.escape(a.objetivo)}</textarea></div>
        <div class="form-grid">
          <div class="field"><label>Preparação necessária</label><input type="text" id="f_preparacao" value="${Utils.escape(a.preparacao)}"></div>
          <div class="field"><label>Materiais</label><input type="text" id="f_materiais" value="${Utils.escape(a.materiais)}"></div>
        </div>
        <div class="field full"><label>Link da reunião</label><input type="text" id="f_link" value="${Utils.escape(a.link)}"></div>
        <div class="field full"><label>Observações</label><textarea id="f_obs">${Utils.escape(a.obs)}</textarea></div>
      </div>

      <div class="form-section">
        <div class="form-section-title">Gestão</div>
        <div class="form-grid">
          <div class="field"><label>Recorrência</label><select id="f_recorrencia">
            ${['Nenhuma','Diária','Semanal','Mensal'].map(t=>`<option ${a.recorrencia===t?'selected':''}>${t}</option>`).join('')}
          </select></div>
          <div class="field"><label>Lembrete</label><select id="f_lembrete">
            ${['Nenhum','5 min antes','10 min antes','15 min antes','30 min antes','1h antes'].map(t=>`<option ${a.lembrete===t?'selected':''}>${t}</option>`).join('')}
          </select></div>
        </div>
        <div class="field full"><label>Dependências</label><input type="text" id="f_dependencias" value="${Utils.escape(a.dependencias)}"></div>
        <div class="form-grid">
          <div class="field"><label class="checkbox-row"><input type="checkbox" id="f_delegavel" ${a.delegavel?'checked':''}> Delegável</label></div>
          <div class="field"><label class="checkbox-row"><input type="checkbox" id="f_remarcavel" ${a.remarcavel?'checked':''}> Pode ser remarcado</label></div>
        </div>
        <div class="field full">
          <label>Registrado por (secretaria executiva)</label>
          <select id="f_registradoPor">
            <option value="">—</option>
            ${State.people.filter(p=>p.tipo==='Equipe').map(p=>`<option value="${p.id}" ${a.registradoPor===p.id?'selected':''}>${Utils.escape(p.nome)} — ${Utils.escape(p.cargo)}</option>`).join('')}
          </select>
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <div>${a.id ? `<button class="btn btn-danger" id="deleteApptBtn">Excluir</button>` : ''}</div>
      <div class="right">
        <button class="btn btn-ghost" id="cancelApptBtn">Cancelar</button>
        <button class="btn btn-primary" id="saveApptBtn">Salvar compromisso</button>
      </div>
    </div>
  `;
  showModal(html);

  document.getElementById('f_priority').addEventListener('click', (e)=>{
    const opt = e.target.closest('.pill-opt'); if(!opt) return;
    document.querySelectorAll('#f_priority .pill-opt').forEach(o=>o.classList.remove('sel'));
    opt.classList.add('sel');
  });
  ['f_start','f_end'].forEach(id=>{
    document.getElementById(id).addEventListener('change', ()=>{
      const s = Utils.timeToMin(document.getElementById('f_start').value);
      const e = Utils.timeToMin(document.getElementById('f_end').value);
      document.getElementById('f_duration').value = e>s ? Utils.fmtDuration(e-s) : '—';
    });
  });
  function refreshLocationAndRoute(){
    const locId = document.getElementById('f_location').value;
    const isVirtual = document.getElementById('f_virtual').checked;
    const detailBox = document.getElementById('locDetailBox');
    const toggleBtn = document.getElementById('routeToggleBtn');
    const panelBox = document.getElementById('routePanelBox');

    if(!locId || isVirtual){
      detailBox.innerHTML = '';
      toggleBtn.classList.add('hidden');
      panelBox.classList.add('hidden');
      panelBox.innerHTML = '';
      return;
    }
    const loc = State.getLocation(locId);
    if(!loc){ detailBox.innerHTML=''; toggleBtn.classList.add('hidden'); return; }
    detailBox.innerHTML = `
      <div class="loc-detail-box">
        <div><span class="ldk">Cidade / País</span>${Utils.escape(loc.cidade)}, ${Utils.escape(loc.pais)}</div>
        <div><span class="ldk">Fuso horário</span>${Utils.escape(loc.fuso)}</div>
        <div><span class="ldk">Deslocamento local médio</span>${loc.deslocamento} min</div>
      </div>`;

    const probeAppt = {
      id: a.id || '__novo__', date: document.getElementById('f_date').value || a.date,
      start: document.getElementById('f_start').value || a.start,
      end: document.getElementById('f_end').value || a.end,
      location: locId, virtual:false
    };
    const route = RouteEngine.getRoute(probeAppt);
    if(!route){
      toggleBtn.classList.add('hidden');
      panelBox.classList.add('hidden');
      panelBox.innerHTML = '';
      return;
    }
    toggleBtn.classList.remove('hidden');
    const vehicleDetail = route.vehicle
      ? `${Utils.escape(route.vehicle.modelo)} <span class="veh-code">${Utils.escape(route.vehicle.codigo)}</span>`
      : Utils.escape(route.categoryLabel);
    panelBox.innerHTML = `
      <div class="route-line">
        <div class="route-point">
          <div class="rp-lbl">Origem</div>
          <div class="rp-name">${Utils.escape(route.originLoc.nome)}</div>
          <div class="rp-sub">${Utils.escape(route.originLoc.cidade)}, ${Utils.escape(route.originLoc.pais)} · ${Utils.escape(route.originLoc.fuso)}</div>
        </div>
        <div class="route-arrow">${vehicleIcon(route.category)}<span class="veh">${Utils.escape(route.categoryLabel)}</span></div>
        <div class="route-point" style="text-align:right">
          <div class="rp-lbl">Destino</div>
          <div class="rp-name">${Utils.escape(route.destLoc.nome)}</div>
          <div class="rp-sub">${Utils.escape(route.destLoc.cidade)}, ${Utils.escape(route.destLoc.pais)} · ${Utils.escape(route.destLoc.fuso)}</div>
        </div>
      </div>
      <div class="route-meta">
        <span class="route-badge">Distância: ${route.distanceKm!=null ? route.distanceKm+' km' : 'trajeto local'}</span>
        <span class="route-badge">Duração prevista: ${Utils.fmtDuration(route.durationMin)}</span>
        <span class="route-badge">Veículo: ${vehicleDetail}</span>
      </div>
      ${route.vehicle ? `<div class="route-fleet-note">Capacidade: ${route.vehicle.capacidade} pax · Velocidade média: ${route.vehicle.velocidadeMediaKmh} km/h · ${Utils.escape(route.vehicle.observacao)}</div>` : ''}
    `;
  }
  refreshLocationAndRoute();
  ['f_location','f_virtual','f_date','f_start','f_end'].forEach(id=>{
    document.getElementById(id).addEventListener('change', refreshLocationAndRoute);
  });
  document.getElementById('routeToggleBtn').addEventListener('click', ()=>{
    const panelBox = document.getElementById('routePanelBox');
    const label = document.getElementById('routeToggleLabel');
    const open = panelBox.classList.toggle('hidden');
    label.textContent = open ? 'Ver trajeto até este compromisso' : 'Ocultar trajeto';
  });

  const suggestBtn = document.getElementById('suggestReschedule');
  if(suggestBtn){
    suggestBtn.addEventListener('click', ()=>{
      const dur = Utils.timeToMin(a.end)-Utils.timeToMin(a.start);
      const slot = SchedulingEngine.findFreeSlot(a.date, dur>0?dur:30);
      if(slot){
        document.getElementById('f_start').value = slot.start;
        document.getElementById('f_end').value = slot.end;
        document.getElementById('f_duration').value = Utils.fmtDuration(dur);
        toast('Novo horário sugerido aplicado ao formulário. Salve para confirmar.');
      } else {
        toast('Nenhum horário livre suficiente encontrado neste dia.', 'danger');
      }
    });
  }
  document.getElementById('closeModalBtn').addEventListener('click', closeModal);
  document.getElementById('cancelApptBtn').addEventListener('click', closeModal);
  const delBtn = document.getElementById('deleteApptBtn');
  if(delBtn) delBtn.addEventListener('click', ()=>{
    confirmDelete('compromisso', ()=>{
      State.appointments = State.appointments.filter(x=>x.id!==a.id);
      State.persist(); closeModal(); toast('Compromisso excluído.'); renderCurrentView(); updateTopbar();
    });
  });
  document.getElementById('saveApptBtn').addEventListener('click', ()=>{
    const title = document.getElementById('f_title').value.trim();
    if(!title){ toast('Informe um título para o compromisso.', 'danger'); return; }
    const start = document.getElementById('f_start').value;
    const end = document.getElementById('f_end').value;
    if(Utils.timeToMin(end) <= Utils.timeToMin(start)){ toast('A hora final deve ser após a hora inicial.', 'danger'); return; }
    const selectedPriority = document.querySelector('#f_priority .pill-opt.sel')?.dataset.val || 'media';
    const participants = [...document.querySelectorAll('.ppl-check:checked')].map(c=>c.value);

    const payload = {
      title, type:document.getElementById('f_type').value, date:document.getElementById('f_date').value,
      start, end, categoryId:document.getElementById('f_category').value, priority:selectedPriority,
      status:document.getElementById('f_status').value, participants, responsavel:document.getElementById('f_responsavel').value,
      externos:document.getElementById('f_externos').value, grupo:document.getElementById('f_grupo').value,
      location:document.getElementById('f_location').value, virtual:document.getElementById('f_virtual').checked,
      objetivo:document.getElementById('f_objetivo').value, obs:document.getElementById('f_obs').value,
      preparacao:document.getElementById('f_preparacao').value, materiais:document.getElementById('f_materiais').value,
      link:document.getElementById('f_link').value, recorrencia:document.getElementById('f_recorrencia').value,
      lembrete:document.getElementById('f_lembrete').value, dependencias:document.getElementById('f_dependencias').value,
      tarefaRelacionada:a.tarefaRelacionada||'', delegavel:document.getElementById('f_delegavel').checked,
      remarcavel:document.getElementById('f_remarcavel').checked, tzParticipants:a.tzParticipants||[],
      registradoPor:document.getElementById('f_registradoPor').value
    };

    if(a.id){
      const idx = State.appointments.findIndex(x=>x.id===a.id);
      State.appointments[idx] = {...State.appointments[idx], ...payload};
      toast('Compromisso atualizado.');
    } else {
      State.appointments.push({id:Utils.uid('appt'), ...payload});
      toast('Compromisso criado.');
    }
    State.persist(); closeModal(); renderCurrentView(); updateTopbar();
  });
}

/* ============================================================
   MODALS — Task / Queue item
   ============================================================ */
function openTaskModal(id, forcedStatus){
  const t = id ? State.tasks.find(x=>x.id===id) : {
    id:null, title:'', priority:'media', duracao:30, prazo:Utils.dateKey(new Date()),
    categoryId:State.categories[0]?.id||'', responsavel:'', location:'', dependencias:'', status:forcedStatus||'fila'
  };
  const catOptions = State.categories.map(c=>`<option value="${c.id}" ${t.categoryId===c.id?'selected':''}>${Utils.escape(categoryPath(c.id))}</option>`).join('');
  const respOptions = `<option value="">—</option>` + State.people.map(p=>`<option value="${p.id}" ${t.responsavel===p.id?'selected':''}>${Utils.escape(p.nome)}</option>`).join('');
  const locOptions = `<option value="">—</option>` + State.locations.map(l=>`<option value="${l.id}" ${t.location===l.id?'selected':''}>${Utils.escape(l.nome)}</option>`).join('');

  const html = `
    <div class="modal-head"><h3>${t.id?'Editar tarefa':'Nova tarefa'}</h3><button class="icon-btn" id="closeModalBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="modal-body">
      <div class="field full"><label>Título</label><input type="text" id="t_title" value="${Utils.escape(t.title)}" placeholder="Ex: Revisar documento"></div>
      <div class="form-grid c3">
        <div class="field"><label>Prioridade</label><select id="t_priority">
          ${['critical','alta','media','baixa'].map(p=>`<option value="${p}" ${t.priority===p?'selected':''}>${priorityLabel(p)}</option>`).join('')}
        </select></div>
        <div class="field"><label>Duração estimada (min)</label><input type="number" id="t_duracao" value="${t.duracao}" min="5" step="5"></div>
        <div class="field"><label>Prazo</label><input type="date" id="t_prazo" value="${t.prazo}"></div>
      </div>
      <div class="form-grid">
        <div class="field"><label>Categoria</label><select id="t_category">${catOptions}</select></div>
        <div class="field"><label>Responsável</label><select id="t_responsavel">${respOptions}</select></div>

      <div class="form-grid">
        <div class="field"><label>Localização necessária</label><select id="t_location">${locOptions}</select></div>
        <div class="field"><label>Status</label><select id="t_status">
          ${[['fila','Na fila'],['andamento','Em andamento'],['concluido','Concluído']].map(([v,l])=>`<option value="${v}" ${t.status===v?'selected':''}>${l}</option>`).join('')}
        </select></div>
      </div>
      <div class="field full"><label>Dependências</label><input type="text" id="t_dependencias" value="${Utils.escape(t.dependencias)}"></div>
    </div>

      <div>${t.id?`<button class="btn btn-danger" id="deleteTaskBtn">Excluir</button>`:''}</div>
      <div class="right"><button class="btn btn-ghost" id="cancelTaskBtn">Cancelar</button><button class="btn btn-primary" id="saveTaskBtn">Salvar tarefa</button></div>
    </div>
  `;
  showModal(html);
  document.getElementById('closeModalBtn').addEventListener('click', closeModal);
  document.getElementById('cancelTaskBtn').addEventListener('click', closeModal);
  const delBtn = document.getElementById('deleteTaskBtn');
  if(delBtn) delBtn.addEventListener('click', ()=> confirmDelete('tarefa', ()=>{
    State.tasks = State.tasks.filter(x=>x.id!==t.id); State.persist(); closeModal(); toast('Tarefa excluída.'); renderCurrentView(); updateTopbar();
  }));
  document.getElementById('saveTaskBtn').addEventListener('click', ()=>{
    const title = document.getElementById('t_title').value.trim();
    if(!title){ toast('Informe um título para a tarefa.', 'danger'); return; }
    const payload = {
      title, priority:document.getElementById('t_priority').value, duracao:Number(document.getElementById('t_duracao').value)||30,
      prazo:document.getElementById('t_prazo').value, categoryId:document.getElementById('t_category').value,
      responsavel:document.getElementById('t_responsavel').value, location:document.getElementById('t_location').value,
      dependencias:document.getElementById('t_dependencias').value, status:document.getElementById('t_status').value
    };
    if(t.id){
      const idx = State.tasks.findIndex(x=>x.id===t.id);
      State.tasks[idx] = {...State.tasks[idx], ...payload};
      toast('Tarefa atualizada.');
    } else {
      State.tasks.push({id:Utils.uid('task'), ...payload});
      toast('Tarefa criada.');
    }
    State.persist(); closeModal(); renderCurrentView(); updateTopbar();
  });
}

      Object.assign(State.getInitiative(id), data);

    }
    State.persist();
    toast('Iniciativa salva.');
    closeModal();
    renderCurrentView();
  });

/* ============================================================
   MODAL / CONFIRM SHELL
   ============================================================ */
function showModal(html){
  document.getElementById('modalRoot').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('open');
}
function closeModal(){
  document.getElementById('modalOverlay').classList.remove('open');
  setTimeout(()=>{ document.getElementById('modalRoot').innerHTML=''; }, 150);
}
function confirmDelete(label, onConfirm){
  const html = `
    <div class="modal confirm-box" style="max-width:380px;">
      <div class="modal-head"><h3>Confirmar exclusão</h3></div>
      <div class="modal-body"><p style="font-size:13px; color:var(--text-secondary);">Tem certeza que deseja excluir ${label}? Esta ação não pode ser desfeita.</p></div>
      <div class="modal-foot"><div></div><div class="right">
        <button class="btn btn-ghost" id="confirmCancelBtn">Cancelar</button>
        <button class="btn btn-danger" id="confirmOkBtn">Excluir</button>
      </div></div>
    </div>
  `;
  document.getElementById('modalRoot').outerHTML = `<div id="modalRoot">${html}</div>`;
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('confirmCancelBtn').addEventListener('click', closeModal);
  document.getElementById('confirmOkBtn').addEventListener('click', ()=>{ onConfirm(); closeModal(); });
}

/* ============================================================
   NAVIGATION / MAIN RENDER DISPATCH
   ============================================================ */
function renderCurrentView(){
  setActiveNav();
  switch(State.currentView){
    case 'overview': renderOverview(); break;
    case 'agenda': renderAgenda(); break;
    case 'tasks': renderTasksView(); break;
    case 'queue': renderQueueView(); break;
    case 'appointments': renderAppointmentsView(); break;
    case 'intelligence': renderIntelligenceView(); break;
    case 'consignment': renderConsignmentView(); break;
    case 'people': renderPeopleView(); break;
    case 'locations': renderLocationsView(); break;
    case 'fleet': renderFleetView(); break;
    case 'categories': renderCategoriesView(); break;
    case 'priorities': renderPrioritiesView(); break;
    case 'availability': renderAvailabilityView(); break;
    case 'settings': renderSettingsView(); break;
    default: renderOverview();
  }
  updateTopbar();
}

function wireGlobalEvents(){
  document.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      State.currentView = el.dataset.view;
      if(State.currentView==='agenda') State.agendaView='day';
      renderCurrentView();
      closeSidebarMobile();
    });
  });
  document.getElementById('prevPeriod').addEventListener('click', ()=>{
    const step = State.currentView==='agenda' && State.agendaView==='week' ? 7 : 1;
    State.currentDate = Utils.addDays(State.currentDate, -step);
    renderCurrentView();
  });
  document.getElementById('nextPeriod').addEventListener('click', ()=>{
    const step = State.currentView==='agenda' && State.agendaView==='week' ? 7 : 1;
    State.currentDate = Utils.addDays(State.currentDate, step);
    renderCurrentView();
  });
  document.getElementById('todayBtn').addEventListener('click', ()=>{
    State.currentDate = new Date();
    renderCurrentView();
  });
  document.querySelectorAll('.view-tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
      document.querySelectorAll('.view-tab').forEach(t=>t.classList.remove('active'));
      tab.classList.add('active');
      State.agendaView = tab.dataset.agview;
      renderCurrentView();
    });
  });
  document.getElementById('newApptBtn').addEventListener('click', ()=>openApptModal(null));
  document.getElementById('globalSearch').addEventListener('input', Utils.debounce((e)=>{
    State.searchTerm = e.target.value.trim();
    if(['appointments','people'].includes(State.currentView)) renderCurrentView();
  }, 200));
  document.getElementById('modalOverlay').addEventListener('mousedown', (e)=>{
    if(e.target.id==='modalOverlay') closeModal();
  });
  document.addEventListener('keydown', (e)=>{
    if(e.key==='Escape') closeModal();
  });

  // Menu mobile — abre/fecha a sidebar em telas estreitas
  document.getElementById('menuToggle').addEventListener('click', ()=>{
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarBackdrop').classList.toggle('open');
  });
  document.getElementById('sidebarBackdrop').addEventListener('click', closeSidebarMobile);
}
function closeSidebarMobile(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarBackdrop').classList.remove('open');
}

// Relógio do topbar — atualiza a cada segundo, independente da view atual
function tickTopClock(){
  const el = document.getElementById('topClock');
  if(!el) return;
  const now = new Date();
  el.textContent = `${Utils.pad(now.getHours())}:${Utils.pad(now.getMinutes())}:${Utils.pad(now.getSeconds())}`;
}

/* ============================================================
   INIT
   ============================================================ */
State.init();
wireGlobalEvents();
renderCurrentView();
tickTopClock();
setInterval(tickTopClock, 1000);
setInterval(()=>{ if(State.currentView==='overview') renderOverview(); if(State.currentView==='agenda' && State.agendaView==='day') renderAgenda(); updateTopbar(); }, 60000);

})();
</script>
